x-backend: &backend
  build: ./backend
  environment:
    APP_ENV: ${APP_ENV:?Set APP_ENV in .env}
    LOG_LEVEL: ${LOG_LEVEL:?Set LOG_LEVEL in .env}
    HTTP_PORT: ${HTTP_PORT:?Set HTTP_PORT in .env}
    POSTGRES_HOST: ${POSTGRES_HOST:?Set POSTGRES_HOST in .env}
    POSTGRES_PORT: ${POSTGRES_PORT:?Set POSTGRES_PORT in .env}
    POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:?Set CORS_ALLOWED_ORIGIN in .env}
    NOTIFICATION_PROVIDER_URL: ${NOTIFICATION_PROVIDER_URL:-http://notification-demo:8082/notify}
    NOTIFICATION_TIMEOUT_SECONDS: ${NOTIFICATION_TIMEOUT_SECONDS:-2}
    NOTIFICATION_RETRY_INTERVAL_MS: ${NOTIFICATION_RETRY_INTERVAL_MS:-1000}
    NOTIFICATION_MAX_ATTEMPTS: ${NOTIFICATION_MAX_ATTEMPTS:-3}
    ALLOW_TEST_APPOINTMENT_CONFIRM: ${ALLOW_TEST_APPOINTMENT_CONFIRM:-true}
    YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
    YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
    SMSAERO_EMAIL: ${SMSAERO_EMAIL:-}
    SMSAERO_API_KEY: ${SMSAERO_API_KEY:-}
    SMSAERO_SIGN: ${SMSAERO_SIGN:-}
    SMSRU_API_KEY: ${SMSRU_API_KEY:-}
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
    TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
    WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}
    WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:-}
    WEB_PUSH_CONTACT: ${WEB_PUSH_CONTACT:-}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-}
    SMTP_USERNAME: ${SMTP_USERNAME:-}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_FROM: ${SMTP_FROM:-}
    SMTP_TLS: ${SMTP_TLS:-}
    SMTP_APP_BASE_URL: ${SMTP_APP_BASE_URL:-}
    RAG_AGENT_URL: ${RAG_AGENT_URL:-http://rag-agent:8095}

services:
  ml-service:
    build: ./services/ml-service
    restart: always
    environment:
      MODEL_PATH: /models/eta.joblib
    volumes:
      - ml_model_data:/models
      - ./ml-data:/app/ml-data
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')\""]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 256m
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  rag-agent:
    build: ./services/rag-agent
    restart: always
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      BACKEND_URL: http://backend:8080
      PORT: "8095"
      GIGACHAT_CREDENTIALS: ${GIGACHAT_CREDENTIALS:-}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
      GIGACHAT_MODEL: ${GIGACHAT_MODEL:-GigaChat}
    ports:
      - "127.0.0.1:8095:8095"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8095/health')\""]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M

  postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command:
      - "postgres"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "idle_in_transaction_session_timeout=30s"
      - "-c"
      - "idle_session_timeout=10min"
      - "-c"
      - "statement_timeout=30s"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  swagger:
    image: swaggerapi/swagger-ui
    restart: always
    ports:
      - "8081:8080"
    volumes:
      - ./docs/openapi.yaml:/openapi.yaml
    environment:
      SWAGGER_JSON: /openapi.yaml
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M

  backend:
    <<: *backend
    restart: always
    volumes:
      - ./queue_policy.yaml:/app/queue_policy.yaml:ro
    ports:
      - "127.0.0.1:${HTTP_PORT}:${HTTP_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$$HTTP_PORT/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    stop_grace_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  notification-demo:
    build: ./backend
    command: ["notify-demo"]
    restart: always
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      NOTIFICATION_DEMO_PORT: "8082"
    ports:
      - "127.0.0.1:8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8082/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M

  frontend:
    build: ./frontend
    restart: always
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
      VITE_BACKEND_TARGET: http://backend:8080
      VITE_RAG_TARGET: http://rag-agent:8095
      PUBLIC_APP_BASE_URL: ${PUBLIC_APP_BASE_URL:-}
    volumes:
      - ./frontend:/app
      # A named volume avoids reusing an orphaned anonymous volume that can mask
      # dependencies installed into the image. The command repairs an empty volume
      # after a clean checkout without changing the lockfile.
      - frontend_node_modules:/app/node_modules
    command: ["sh", "-c", "if ! test -f node_modules/@fontsource-variable/onest/wght.css || ! test -f node_modules/clsx/package.json; then rm -rf node_modules/* node_modules/.[!.]* 2>/dev/null || true; cp -a /opt/node_modules/. node_modules/; fi; test -f node_modules/@fontsource-variable/onest/wght.css && test -x node_modules/.bin/vite && exec npm run dev"]
    ports:
      - "127.0.0.1:${FRONTEND_PORT:?Set FRONTEND_PORT in .env}:5173"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  prometheus:
    image: prom/prometheus:v2.55.0
    restart: always
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - alertmanager
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    restart: always
    command:
      - "--no-collector.stat_bgwriter"
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: always
    entrypoint: ["/entrypoint.sh"]
    volumes:
      - ./monitoring/alertmanager/alertmanager.template.yml:/etc/alertmanager/alertmanager.template.yml:ro
      - ./monitoring/alertmanager/entrypoint.sh:/entrypoint.sh:ro
      - alertmanager_data:/alertmanager
    environment:
      TZ: ${TZ:-Europe/Moscow}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    ports:
      - "127.0.0.1:9093:9093"
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M

  loki:
    image: grafana/loki:3.0.0
    restart: always
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  promtail:
    image: grafana/promtail:3.0.0
    restart: always
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  grafana:
    image: grafana/grafana:11.3.0
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in .env}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/definitions/overview.json
      GF_SERVER_DOMAIN: ${SERVER_DOMAIN:-post-queue.duckdns.org}
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - loki
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  postgres-backup:
    image: prodrigestivill/postgres-backup-local:17-alpine
    restart: always
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SCHEDULE: "@every 6h"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
      HEALTHCHECK_PORT: 80
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M

volumes:
  ml_model_data:
  postgres_data:
  frontend_node_modules:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  loki_data:

# Avoid the 172.18.0.0/16 range used by the host VPN (tun0). A collision
# routes published-port replies away from containers and resets connections.
networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16
