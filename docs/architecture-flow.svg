<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#f8fafc; font-family:'Onest', 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Soft Shadows -->
    <filter id="cardShadow" x="-10%" y="-8%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <filter id="hoverShadow" x="-10%" y="-8%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0055A5" flood-opacity="0.12"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0055A5"/>
      <stop offset="100%" stop-color="#052F85"/>
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#0055A5"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#ea580c"/>
    </marker>
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#0284c7"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#059669"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="680" fill="#f8fafc"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.4" stroke="#e2e8f0" stroke-width="1">
    <pattern id="lightGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30"/>
    </pattern>
    <rect width="1200" height="680" fill="url(#lightGrid)"/>
  </g>

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(50, 36)">
    <!-- Brand Icon -->
    <rect x="0" y="0" width="46" height="46" rx="12" fill="url(#headerGrad)"/>
    <path d="M14 17 L23 24 L32 17 M14 28 L23 28 L32 28" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    
    <text x="60" y="22" fill="#0f172a" font-size="20" font-weight="800" letter-spacing="-0.3">ПОЧТА РОССИИ • ЦИФРОВАЯ ОЧЕРЕДЬ</text>
    <text x="60" y="40" fill="#64748b" font-size="12" font-weight="500">Архитектура сквозного прохождения пользовательского запроса</text>
    
    <!-- Status Badges -->
    <g transform="translate(860, 8)">
      <rect x="0" y="0" width="240" height="32" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow)"/>
      <circle cx="16" cy="16" r="4.5" fill="#10b981"/>
      <text x="28" y="20" fill="#0055A5" font-size="12" font-weight="700">pointers-team.tech</text>
      <text x="165" y="20" fill="#64748b" font-size="11" font-weight="600">• Production</text>
    </g>
  </g>

  <!-- ==================== 1. КЛИЕНТ ==================== -->
  <g transform="translate(50, 115)" filter="url(#cardShadow)">
    <rect width="180" height="515" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect width="180" height="46" rx="16" fill="#f1f5f9"/>
    <text x="90" y="29" fill="#0f172a" font-size="13" font-weight="700" text-anchor="middle">1. КЛИЕНТ</text>

    <!-- Device Icon -->
    <g transform="translate(62, 75)">
      <rect x="0" y="0" width="56" height="56" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
      <rect x="14" y="10" width="28" height="36" rx="4" fill="none" stroke="#0055A5" stroke-width="2"/>
      <circle cx="28" cy="40" r="1.5" fill="#0055A5"/>
      <path d="M22 14 H34" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <text x="90" y="155" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle">Пользователь</text>
    <text x="90" y="174" fill="#64748b" font-size="11" text-anchor="middle">Web / Мобильный клиент</text>

    <!-- Request Types -->
    <g transform="translate(15, 205)">
      <rect width="150" height="68" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="14" y="22" fill="#0055A5" font-size="10" font-weight="700">GET /</text>
      <text x="50" y="22" fill="#64748b" font-size="10">Интерфейс талона</text>
      <text x="14" y="44" fill="#ea580c" font-size="10" font-weight="700">GET /api/*</text>
      <text x="68" y="44" fill="#64748b" font-size="10">Запрос в очередь</text>
      <text x="14" y="60" fill="#10b981" font-size="9" font-weight="600">POST /tickets</text>
      <text x="82" y="60" fill="#64748b" font-size="9">Взять талон</text>
    </g>

    <!-- Security Pill -->
    <g transform="translate(20, 305)">
      <rect width="140" height="30" rx="15" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
      <text x="70" y="20" fill="#047857" font-size="11" font-weight="700" text-anchor="middle">🔒 HTTPS (443)</text>
    </g>

    <g transform="translate(20, 360)" fill="#64748b" font-size="11">
      <text x="0" y="0">• Безопасный TLS 1.3</text>
      <text x="0" y="22">• Быстрый HTTP/2 &amp; h3</text>
      <text x="0" y="44">• Автоматический DoH</text>
      <text x="0" y="66">• PWA / Кэширование</text>
    </g>
  </g>

  <!-- Flow 1: Client -> Cloudflare -->
  <path d="M230 310 L280 310" stroke="#0055A5" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#arrowBlue)"/>
  <rect x="238" y="288" width="36" height="18" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="256" y="301" fill="#0055A5" font-size="9" font-weight="700" text-anchor="middle">WAN</text>

  <!-- ==================== 2. CLOUDFLARE EDGE ==================== -->
  <g transform="translate(285, 115)" filter="url(#cardShadow)">
    <rect width="190" height="515" rx="16" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
    <rect width="190" height="46" rx="16" fill="#fff7ed"/>
    <text x="95" y="29" fill="#c2410c" font-size="13" font-weight="700" text-anchor="middle">2. CLOUDFLARE EDGE</text>

    <!-- Cloud Icon -->
    <g transform="translate(67, 75)">
      <rect x="0" y="0" width="56" height="56" rx="14" fill="#fff7ed" stroke="#ffedd5" stroke-width="1.5"/>
      <path d="M16 32 C14 26 21 21 27 23 C30 19 37 19 40 23 C46 23 49 28 47 34 C50 35 52 39 50 42 C48 45 44 46 41 46 H13 C9 46 6 42 7 38 C9 35 12 33 16 32 Z" fill="#ea580c"/>
    </g>

    <text x="95" y="155" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle">Edge Защита и CDN</text>
    <text x="95" y="174" fill="#ea580c" font-size="11" font-weight="600" text-anchor="middle">Периметр безопасности</text>

    <!-- Protection items -->
    <g transform="translate(18, 205)" font-size="11" fill="#334155">
      <rect x="0" y="0" width="154" height="34" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <circle cx="12" cy="17" r="3" fill="#10b981"/>
      <text x="22" y="21" font-weight="600">DDoS Protection</text>

      <rect x="0" y="42" width="154" height="34" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <circle cx="12" cy="59" r="3" fill="#10b981"/>
      <text x="22" y="63" font-weight="600">Web App Firewall</text>

      <rect x="0" y="84" width="154" height="34" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <circle cx="12" cy="101" r="3" fill="#10b981"/>
      <text x="22" y="105" font-weight="600">SSL/TLS Терминация</text>

      <rect x="0" y="126" width="154" height="34" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <circle cx="12" cy="143" r="3" fill="#10b981"/>
      <text x="22" y="147" font-weight="600">CDN Кэширование</text>
    </g>

    <!-- Pass to Origin -->
    <g transform="translate(15, 410)">
      <rect width="160" height="75" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
      <text x="80" y="24" fill="#9a3412" font-size="10" font-weight="700" text-anchor="middle">ПРОКСИРОВАНИЕ В КЛАСТЕР</text>
      <text x="80" y="44" fill="#ea580c" font-size="12" font-weight="800" text-anchor="middle">HTTPS / 443</text>
      <text x="80" y="62" fill="#7c2d12" font-size="10" text-anchor="middle">Зашифрованный трафик</text>
    </g>
  </g>

  <!-- Flow 2: Cloudflare -> Ingress -->
  <path d="M475 310 L525 310" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#arrowOrange)"/>
  <rect x="483" y="288" width="40" height="18" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="503" y="301" fill="#ea580c" font-size="9" font-weight="700" text-anchor="middle">HTTPS</text>

  <!-- ==================== 3. KUBERNETES CLUSTER ==================== -->
  <rect x="530" y="95" width="620" height="555" rx="20" fill="#ffffff" stroke="#93c5fd" stroke-width="2" filter="url(#cardShadow)"/>
  
  <!-- Cluster Header Ribbon -->
  <rect x="530" y="95" width="620" height="42" rx="20" fill="#eff6ff"/>
  <rect x="530" y="125" width="620" height="12" fill="#eff6ff"/>
  <circle cx="555" cy="116" r="6" fill="#326ce5"/>
  <text x="570" y="121" fill="#0055A5" font-size="13" font-weight="800">КЛАСТЕР KUBERNETES (K3s • MULTI-NODE)</text>
  <text x="1130" y="121" fill="#0284c7" font-size="11" font-weight="600" text-anchor="end">Helm Release: queue-release</text>

  <!-- 3.1 INGRESS CONTROLLER (TRAEFIK) -->
  <g transform="translate(550, 150)">
    <rect width="180" height="480" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="180" height="38" rx="14" fill="#0055A5"/>
    <text x="90" y="24" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">INGRESS CONTROLLER</text>

    <text x="90" y="60" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">Traefik v3</text>
    <text x="90" y="76" fill="#64748b" font-size="10" text-anchor="middle">Порты: :80 и :443</text>

    <!-- Path Routers -->
    <g transform="translate(12, 100)">
      <!-- Router 1: Backend -->
      <rect width="156" height="85" rx="10" fill="#ffffff" stroke="#38bdf8" stroke-width="1.5" filter="url(#cardShadow)"/>
      <rect x="8" y="10" width="70" height="20" rx="4" fill="#e0f2fe"/>
      <text x="43" y="24" fill="#0284c7" font-size="10" font-weight="800" text-anchor="middle">/api/*</text>
      <text x="8" y="48" fill="#0f172a" font-size="11" font-weight="700">Бэкенд API</text>
      <text x="8" y="65" fill="#64748b" font-size="9">Маршрутизация в сервис</text>
      <text x="8" y="76" fill="#0284c7" font-size="9" font-weight="600">backend:8080</text>

      <!-- Router 2: Frontend -->
      <g transform="translate(0, 105)">
        <rect width="156" height="85" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.5" filter="url(#cardShadow)"/>
        <rect x="8" y="10" width="45" height="20" rx="4" fill="#d1fae5"/>
        <text x="30" y="24" fill="#047857" font-size="10" font-weight="800" text-anchor="middle">/*</text>
        <text x="8" y="48" fill="#0f172a" font-size="11" font-weight="700">SPA Фронтенд</text>
        <text x="8" y="65" fill="#64748b" font-size="9">Маршрутизация в сервис</text>
        <text x="8" y="76" fill="#059669" font-size="9" font-weight="600">frontend:80</text>
      </g>

      <!-- Router 3: Metrics -->
      <g transform="translate(0, 210)">
        <rect width="156" height="75" rx="10" fill="#ffffff" stroke="#c084fc" stroke-width="1.2" filter="url(#cardShadow)"/>
        <rect x="8" y="10" width="65" height="18" rx="4" fill="#f3e8ff"/>
        <text x="40" y="23" fill="#7e22ce" font-size="9" font-weight="800" text-anchor="middle">/metrics</text>
        <text x="8" y="45" fill="#0f172a" font-size="11" font-weight="700">Метрики</text>
        <text x="8" y="62" fill="#64748b" font-size="9">Prometheus Scrape</text>
      </g>
    </g>

    <text x="90" y="430" fill="#94a3b8" font-size="9" text-anchor="middle">L7 Load Balancing</text>
    <text x="90" y="445" fill="#94a3b8" font-size="9" text-anchor="middle">Zero-Downtime Reload</text>
  </g>

  <!-- Connectors from Traefik -->
  <!-- 1. To Backend -->
  <path d="M730 250 L770 250" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <!-- 2. To Frontend -->
  <path d="M730 355 L770 355" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <!-- 3. To Metrics -->
  <path d="M730 460 L770 460" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrowPurple)"/>

  <!-- ==================== 3.2 MICROSERVICES & DATA ==================== -->
  
  <!-- SERVICE 1: GO BACKEND -->
  <g transform="translate(770, 150)" filter="url(#cardShadow)">
    <rect width="360" height="165" rx="12" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
    <rect width="360" height="34" rx="12" fill="#f0f9ff"/>
    <circle cx="16" cy="17" r="4.5" fill="#0284c7"/>
    <text x="28" y="21" fill="#0369a1" font-size="12" font-weight="800">GO BACKEND SERVICE</text>
    <text x="345" y="21" fill="#0284c7" font-size="10" font-weight="700" text-anchor="end">2 Реплики (High Availability)</text>

    <!-- Pod 1 -->
    <g transform="translate(12, 45)">
      <rect width="162" height="70" rx="8" fill="#f8fafc" stroke="#e0f2fe" stroke-width="1"/>
      <circle cx="12" cy="14" r="3.5" fill="#10b981"/>
      <text x="20" y="17" fill="#0f172a" font-size="10" font-weight="700">Реплика 1</text>
      <text x="145" y="17" fill="#10b981" font-size="9" font-weight="600" text-anchor="end">1/1 Ready</text>
      <text x="12" y="38" fill="#64748b" font-size="9">CPU: 3m | RAM: 4 MiB</text>
      <text x="12" y="54" fill="#0369a1" font-size="9">Порт: 8080 (HTTP)</text>
    </g>

    <!-- Pod 2 -->
    <g transform="translate(186, 45)">
      <rect width="162" height="70" rx="8" fill="#f8fafc" stroke="#e0f2fe" stroke-width="1"/>
      <circle cx="12" cy="14" r="3.5" fill="#10b981"/>
      <text x="20" y="17" fill="#0f172a" font-size="10" font-weight="700">Реплика 2</text>
      <text x="145" y="17" fill="#10b981" font-size="9" font-weight="600" text-anchor="end">1/1 Ready</text>
      <text x="12" y="38" fill="#64748b" font-size="9">CPU: 3m | RAM: 4 MiB</text>
      <text x="12" y="54" fill="#0369a1" font-size="9">Порт: 8080 (HTTP)</text>
    </g>

    <!-- Probes description -->
    <text x="16" y="135" fill="#475569" font-size="9" font-weight="600">LivenessProbe: /health (Рантайм)</text>
    <text x="190" y="135" fill="#475569" font-size="9" font-weight="600">ReadinessProbe: /ready (Пинг БД)</text>
    <text x="16" y="152" fill="#0284c7" font-size="9">Zero-Downtime Rolling Update • Легковесный бинарник</text>
  </g>

  <!-- Flow: Backend -> Database -->
  <path d="M1020 315 L1020 335" stroke="#0055A5" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <rect x="990" y="318" width="60" height="15" rx="3" fill="#ffffff" stroke="#bfdbfe" stroke-width="0.8"/>
  <text x="1020" y="329" fill="#0055A5" font-size="8" font-weight="800" text-anchor="middle">SQL :5432</text>

  <!-- SERVICE 2: POSTGRESQL DATABASE -->
  <g transform="translate(770, 335)" filter="url(#cardShadow)">
    <rect width="360" height="75" rx="12" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
    <rect width="360" height="28" rx="12" fill="#eef2ff"/>
    <circle cx="16" cy="14" r="4.5" fill="#4f46e5"/>
    <text x="28" y="18" fill="#3730a3" font-size="11" font-weight="800">POSTGRESQL 17 • БАЗА ДАННЫХ</text>
    <text x="345" y="18" fill="#4f46e5" font-size="10" font-weight="600" text-anchor="end">Stateful Хранилище</text>

    <g transform="translate(12, 38)">
      <circle cx="8" cy="8" r="3.5" fill="#10b981"/>
      <text x="18" y="11" fill="#0f172a" font-size="10" font-weight="700">postgres-deployment (1/1 Ready)</text>
      <text x="18" y="26" fill="#64748b" font-size="9">14 таблиц очереди • Инициализация схем и триггеров</text>

      <!-- Disk PVC badge -->
      <rect x="220" y="-4" width="118" height="32" rx="6" fill="#f8fafc" stroke="#c7d2fe" stroke-width="1"/>
      <text x="279" y="10" fill="#3730a3" font-size="9" font-weight="800" text-anchor="middle">PVC: postgres-pvc</text>
      <text x="279" y="22" fill="#64748b" font-size="8" text-anchor="middle">Постоянный том 2 ГБ</text>
    </g>
  </g>

  <!-- SERVICE 3: REACT FRONTEND -->
  <g transform="translate(770, 425)" filter="url(#cardShadow)">
    <rect width="360" height="110" rx="12" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
    <rect width="360" height="28" rx="12" fill="#ecfdf5"/>
    <circle cx="16" cy="14" r="4.5" fill="#059669"/>
    <text x="28" y="18" fill="#065f46" font-size="11" font-weight="800">REACT FRONTEND • 2 РЕПЛИКИ (NGINX 1.27)</text>
    <text x="345" y="18" fill="#059669" font-size="10" font-weight="600" text-anchor="end">Распределенный отказоустойчивый пул</text>

    <!-- Pod 1 -->
    <g transform="translate(12, 36)">
      <rect width="162" height="60" rx="8" fill="#f8fafc" stroke="#d1fae5" stroke-width="1"/>
      <circle cx="12" cy="14" r="3" fill="#10b981"/>
      <text x="20" y="17" fill="#0f172a" font-size="10" font-weight="700">Фронтенд Реплика 1</text>
      <text x="12" y="34" fill="#64748b" font-size="9">Узел 1 (Master)</text>
      <text x="12" y="48" fill="#059669" font-size="9">1/1 Ready • 4 MiB RAM</text>
    </g>

    <!-- Pod 2 -->
    <g transform="translate(186, 36)">
      <rect width="162" height="60" rx="8" fill="#f8fafc" stroke="#d1fae5" stroke-width="1"/>
      <circle cx="12" cy="14" r="3" fill="#10b981"/>
      <text x="20" y="17" fill="#0f172a" font-size="10" font-weight="700">Фронтенд Реплика 2</text>
      <text x="12" y="34" fill="#64748b" font-size="9">Узел 2 (Worker)</text>
      <text x="12" y="48" fill="#059669" font-size="9">1/1 Ready • 4 MiB RAM</text>
    </g>
  </g>

  <!-- SERVICE 4: METRICS & OBSERVABILITY -->
  <g transform="translate(770, 550)" filter="url(#cardShadow)">
    <rect width="360" height="75" rx="12" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.2"/>
    <rect width="360" height="26" rx="12" fill="#faf5ff"/>
    <circle cx="16" cy="13" r="4" fill="#7c3aed"/>
    <text x="28" y="17" fill="#6b21a8" font-size="10" font-weight="800">СИСТЕМА НАБЛЮДАЕМОСТИ И МЕТРИК</text>
    <text x="345" y="17" fill="#7c3aed" font-size="9" font-weight="600" text-anchor="end">Prometheus &amp; Health</text>

    <g transform="translate(12, 34)" font-size="9" fill="#475569">
      <text x="0" y="12">• Prometheus эндпоинт /metrics для сбора таймингов и задержек</text>
      <text x="0" y="27">• Раздельные K8s пробы: Liveness (Runtime) и Readiness (DB Ping)</text>
    </g>
  </g>
</svg>
