          nullable: true
          description: Client secret token for managing/cancelling the appointment
    QueuePosition:
      type: object
      additionalProperties: false
      required:
      - ticketId
      - ticketStatus
      - reason
      - position
      - referenceWindow
      - calculatedAt
      - effectivePriority
      - effectiveQueueTime
      properties:
        ticketId:
          type: string
          format: uuid
        ticketStatus:
          type: string
          enum:
          - SCHEDULED
          - WAITING
          - CALLED
          - SERVING
          - COMPLETED
          - CANCELLED
          - NO_SHOW
        reason:
          type: string
          enum:
          - AVAILABLE
          - NOT_ELIGIBLE_YET
          - NO_OPEN_COMPATIBLE_WINDOW
          - NOT_QUEUED
        position:
          type: integer
          minimum: 1
          nullable: true
        referenceWindow:
          type: object
          nullable: true
          required:
          - id
          - number
          properties:
            id:
              type: string
              format: uuid
            number:
              type: integer
        calculatedAt:
          type: string
          format: date-time
        effectivePriority:
          type: integer
          format: int64
          nullable: true
