components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
  responses:
    Unauthorized:
      description: Missing, invalid or expired session; invalid login credentials
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Authenticated user lacks required role/capability
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InternalError:
      description: INTERNAL_ERROR (sanitized)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: NOT_FOUND
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: VALIDATION_ERROR
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    IdempotencyConflict:
      description: IDEMPOTENCY_CONFLICT
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidState:
      description: INVALID_TICKET_STATE
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PolicyVersionConflict:
      description: Policy version conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: POLICY_VERSION_CONFLICT
              message: "Version mismatch"
              requestId: "req-123"
  schemas:
    NotificationOutboxItem:
      type: object
      description: Элемент transactional outbox уведомлений.
      required: [id, ticketId, branchId, eventType, payload, status, attempts, maxAttempts, nextAttemptAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        ticketId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        eventType: { type: string }
        payload: { type: string }
        status: { type: string, enum: [PENDING, SENT, FAILED] }
        attempts: { type: integer }
        maxAttempts: { type: integer }
        nextAttemptAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        sentAt: { type: string, format: date-time, nullable: true }
        lastError: { type: string, nullable: true }
    AnomalyTicket:
      type: object
      description: Аномалия талона из domain.AnomalyTicket.
      required: [id, publicNumber, type, description, time, durationMinutes]
      properties:
        id: { type: string, format: uuid }
        publicNumber: { type: string }
        type: { type: string, enum: [EXCEEDED_WAIT, UNFINISHED, NO_SHOW, TECH_ISSUE] }
        description: { type: string }
        time: { type: string, format: date-time }
        durationMinutes: { type: integer }
    TicketETA:
      type: object
      additionalProperties: false
      required: [ticketId, ticketStatus, reason, estimatedWaitSeconds, estimatedCallAt, position, referenceWindow, sampleSize, usedFallback, calculatedAt]
      properties:
        ticketId: { type: string, format: uuid }
        ticketStatus: { $ref: '#/components/schemas/TicketStatus' }
        reason:
          type: string
          enum: [AVAILABLE, NOT_ELIGIBLE_YET, NO_OPEN_COMPATIBLE_WINDOW, NOT_QUEUED]
        estimatedWaitSeconds: { type: integer, minimum: 60, maximum: 1800, nullable: true }
        estimatedCallAt: { type: string, format: date-time, nullable: true }
        position: { type: integer, minimum: 1, nullable: true }
        referenceWindow:
          type: object
          nullable: true
          required: [id, number]
          properties:
            id: { type: string, format: uuid }
            number: { type: integer }
        sampleSize: { type: integer, minimum: 0, maximum: 20 }
        usedFallback: { type: boolean }
        weightedWaitSeconds:
          type: integer
          minimum: 0
          description: Взвешенная длительность обслуживания (300 при недостатке истории), не итоговая ETA; поле отсутствует при reason != AVAILABLE.
        medianSeconds: { type: integer, minimum: 0, description: Медиана длительностей; поле отсутствует при reason != AVAILABLE. }
        p90WaitSeconds: { type: integer, minimum: 0, description: P90 длительностей; поле отсутствует при reason != AVAILABLE. }
        distribution:
          type: object
          description: Распределение длительностей обслуживания; отсутствует при reason != AVAILABLE.
          properties:
            avg: { type: integer, minimum: 0 }
            weightedAvg: { type: integer, minimum: 0 }
            median: { type: integer, minimum: 0 }
            p90: { type: integer, minimum: 0 }
            samples:
              type: array
              maxItems: 20
              items: { type: integer, minimum: 0 }
        calculatedAt: { type: string, format: date-time }
    UserRole:
      type: string
      enum: [client, employee, opc_chief, terminal]
    User:
      type: object
      required: [id, email, role, isTerminal, confirmed]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { $ref: '#/components/schemas/UserRole' }
        isTerminal: { type: boolean }
        confirmed: { type: boolean }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string, format: password }
    StatusOK:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
    QueuePolicy:
      type: object
      description: Legacy-баллы и параметры аудита; автоматический CallNext сортирует по сохранённым due_at, source_rank, checkin_at, id из YAML-планирования.
      additionalProperties: false
      required:
      - branchId
      - appointmentDuePriority
      - qrPriority
      - livePriority
      - antiStarvationThresholdMinutes
      - antiStarvationPointsPerMinute
      - appointmentGraceMinutes
      - appointmentLatePenaltyPerMinute
      - appointmentLatePenaltyMaxPoints
      - version
      - updatedAt
      properties:
        branchId:
          type: string
          format: uuid
        appointmentDuePriority:
          type: integer
          minimum: 0
          maximum: 1000
        qrPriority:
          type: integer
          minimum: 0
          maximum: 1000
        livePriority:
          type: integer
          minimum: 0
          maximum: 1000
        antiStarvationThresholdMinutes:
          type: integer
          minimum: 0
          maximum: 240
        antiStarvationPointsPerMinute:
          type: integer
          minimum: 1
          maximum: 600
        appointmentGraceMinutes:
          type: integer
          minimum: 0
          maximum: 120
        appointmentLatePenaltyPerMinute:
          type: integer
          minimum: 0
          maximum: 600
        appointmentLatePenaltyMaxPoints:
          type: integer
          minimum: 0
          maximum: 1000
        version:
          type: integer
          format: int64
        updatedAt:
          type: string
          format: date-time
    UpdateQueuePolicyRequest:
      type: object
      additionalProperties: false
      description: Core validates appointmentDuePriority > qrPriority and livePriority; appointmentLatePenaltyMaxPoints
        <= appointmentDuePriority. Omitted new fields preserve the current policy only when expectedVersion
        matches; concurrent changes return POLICY_VERSION_CONFLICT. Explicit null is invalid. Every successful
        PUT increments version once, including unchanged values.
      required:
      - appointmentDuePriority
      - qrPriority
      - expectedVersion
      properties:
        appointmentDuePriority:
          type: integer
          minimum: 0
          maximum: 1000
        qrPriority:
          type: integer
          minimum: 0
          maximum: 1000
        livePriority:
          type: integer
          minimum: 0
          maximum: 1000
        antiStarvationThresholdMinutes:
          type: integer
          minimum: 0
          maximum: 240
        antiStarvationPointsPerMinute:
          type: integer
          minimum: 1
          maximum: 600
        appointmentGraceMinutes:
          type: integer
          minimum: 0
          maximum: 120
        appointmentLatePenaltyPerMinute:
          type: integer
          minimum: 0
          maximum: 600
        appointmentLatePenaltyMaxPoints:
          type: integer
          minimum: 0
          maximum: 1000
