        effectiveQueueTime:
          type: string
          format: date-time
          nullable: true
    TicketEvent:
      type: object
      required:
      - id
      - type
      - fromStatus
      - toStatus
      - windowId
      - policyVersion
      - decisionPriority
      - occurredAt
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum:
          - CREATED
          - ARRIVED
          - CALLED
          - SERVICE_STARTED
          - COMPLETED
          - CANCELLED
          - NO_SHOW
          - RETURNED
          - REDIRECTED
          - QUEUE_RECALCULATED
        fromStatus:
          type: string
          nullable: true
          enum: [SCHEDULED, WAITING, CALLED, SERVING, COMPLETED, CANCELLED, NO_SHOW, null]
        toStatus:
          $ref: '#/components/schemas/TicketStatus'
        windowId:
          type: string
          format: uuid
          nullable: true
        policyVersion:
          type: integer
          format: int64
          nullable: true
        decisionPriority:
          type: integer
          format: int64
          nullable: true
          description: Legacy-баллы автоматического/ручного вызова; при повторном вызове recovery worker — source_rank. Не ключ сортировки CallNext; для остальных типов событий null.
        occurredAt:
          type: string
          format: date-time
