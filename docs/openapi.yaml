openapi: 3.0.3
info:
  title: E-SUO Queue Engine API
  version: 1.0.0
  description: Backward-compatible Queue System API (Sprints 1–4). Business dates use Europe/Moscow. Physical QR entry is the SPA route /q/{branchId}; it never creates a ticket automatically.
servers:
  - url: /api/v1
paths:
  /branches/{branchId}/windows:
    $ref: '#/paths/~1admin~1branches~1{branchId}~1windows'
  /windows/{windowId}:
    $ref: '#/paths/~1admin~1windows~1{windowId}'
  /admin/branches/{branchId}/windows:
    post:
      summary: Создать закрытое окно отделения
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: branchId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '201':
          description: Окно создано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Window' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /admin/windows/{windowId}:
    delete:
      summary: Удалить окно без активного талона
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: windowId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Окно удалено }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: WINDOW_BUSY — в окне есть активный талон
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/InternalError' }
  /admin/branches/{branchId}/queue:
    get:
      summary: Получить первые 25 ожидающих талонов и общее количество
      description: Только WAITING, порядок queue_entered_at, id; это список интерфейса, не порядок CallNext.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: branchId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Очередь отделения
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  total: { type: integer }
                  items:
                    type: array
                    maxItems: 25
                    items:
                      type: object
                      required: [id, publicNumber, source, serviceId, serviceName, queueEnteredAt, waitTimeMinutes, status]
                      properties:
                        id: { type: string, format: uuid }
                        publicNumber: { type: string }
                        source: { type: string, enum: [QR, LIVE, APPOINTMENT] }
                        serviceId: { type: string, format: uuid }
                        serviceName: { type: string }
                        queueEnteredAt: { type: string, format: date-time }
                        waitTimeMinutes: { type: integer }
                        status: { type: string, enum: [WAITING] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /branches/{branchId}/tv:
    get:
      summary: Public hall view from backend overview
      parameters:
        - name: branchId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Незакрытые окна и до 15 ожидающих талонов
          content:
            application/json:
              schema:
                type: object
                required: [windows, queue]
                properties:
                  windows:
                    type: array
                    items:
                      type: object
                      required: [number, currentTicketNumber, status]
                      properties:
                        number: { type: integer }
                        currentTicketNumber: { type: string, nullable: true }
                        status: { type: string, enum: [OPEN, CLOSING] }
                  queue:
                    type: array
                    items:
                      type: object
                      required: [publicNumber]
                      properties:
                        publicNumber: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /terminal/branches/{branchId}/services:
    get:
      summary: Services for authenticated terminal-capable user
      security: [{ sessionCookie: [] }]
      parameters:
        - name: branchId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Services
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /terminal/branches/{branchId}/tickets/live:
    post:
      summary: Issue LIVE ticket for authenticated terminal-capable user
      security: [{ sessionCookie: [] }]
      parameters:
        - name: branchId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateLiveTicketRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '200':
          description: Idempotent replay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /tickets/{ticketId}/eta:
    get:
      summary: Approximate backend waiting estimate using canonical QueuePosition
      description: >-
        Используются до 20 последних положительных длительностей COMPLETED той же услуги
        в отделении. Взвешенное среднее имеет веса N..1 от нового к старому; при менее
        трёх измерениях используется 300 секунд. Моделируются position−1 обслуживаний
        длительностью max(30,floor(duration)) на открытых совместимых окнах с ближайшим
        освобождением. Для занятого окна остаток max(30,duration−elapsed), для свободного 0.
        Итоговая оценка ограничена 60–1800 секундами. При reason != AVAILABLE оценки null,
        sampleSize=0, usedFallback=false. Это оценка, не гарантия времени вызова.
      parameters:
        - name: ticketId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Observational estimate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketETA' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /auth/login:
    post:
      summary: Authenticate with existing users and create persistent session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Sets session cookie (HttpOnly, SameSite=Lax, Path=/)
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusOK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/InvalidState' }
        '500': { $ref: '#/components/responses/InternalError' }
  /auth/me:
    get:
      summary: Restore current user from backend session
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      summary: Revoke current session and clear cookie (also succeeds without cookie)
      responses:
        '200':
          description: Session cleared
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusOK' }
        '500': { $ref: '#/components/responses/InternalError' }
  /auth/register:
    post:
      summary: Register a client with existing MVP automatic confirmation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '201':
          description: Client created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
  /auth/confirm:
    get:
      summary: Existing confirmation-token endpoint
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Confirmed
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [confirmed] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /admin/users:
    get:
      security: [{ sessionCookie: [] }]
      summary: List users (opc_chief only)
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: search, in: query, schema: { type: string } }
        - { name: role, in: query, schema: { type: string } }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: object
                required: [items, total, limit, offset]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
                  total: { type: integer, minimum: 0 }
                  limit: { type: integer }
                  offset: { type: integer }
        '500': { $ref: '#/components/responses/InternalError' }
  /admin/users/{userID}/role:
    put:
      security: [{ sessionCookie: [] }]
      summary: Change existing user role (opc_chief only)
      parameters:
        - name: userID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/UserRole' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /branches:
    get:
      summary: List branches
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchListResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /branches/{branchId}/services:
    get:
      summary: List services available in a branch
      parameters:
        - name: branchId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceListResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /branches/{branchId}/workload:
    get:
      summary: Get branch workload distribution and waiting count
      tags:
        - Client
      parameters:
        - name: branchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Branch workload statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  branchId: { type: string }
                  currentHour: { type: integer }
                  currentWaiting: { type: integer }
                  activeWindows: { type: integer, minimum: 0 }
                  estimatedWaitSeconds:
                    type: integer
                    nullable: true
                    description: Approximate branch-wide wait; null when no windows are open. Not a service-specific ticket ETA.
                  calculatedAt: { type: string, format: date-time }
                  usedFallback: { type: boolean }
                  sampleCount: { type: integer }
                  isHistorical: { type: boolean }
                  hourly:
                    type: array
                    items:
                      type: object
                      properties:
                        hour: { type: integer }
                        loadPercent: { type: integer }
                        waitMinutes: { type: integer }
                        isPeak: { type: boolean }
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /branches/{branchId}/tickets/qr:
    post:
      summary: Create a QR ticket
      parameters:
        - name: branchId
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQRTicketRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '200':
          description: OK (Replayed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          description: Missing header or invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /tickets/{ticketId}:
    get:
      summary: Get ticket details
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /operator/branches/{branchId}/windows:
    get:
      security: [{ sessionCookie: [] }]
      summary: List operator windows in a branch
      parameters:
        - name: branchId
          in: path
          required: true
          schema:
            type: string
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Window'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /operator/windows/{windowId}/current-ticket:
    get:
      security: [{ sessionCookie: [] }]
      summary: Get the current active ticket for a window
      parameters:
        - name: windowId
          in: path
          required: true
          schema:
            type: string
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '204':
          description: No Content
        '404':
          description: Window Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /operator/windows/{windowId}/call-next:
    post:
      security: [{ sessionCookie: [] }]
      summary: Автоматический или ручной вызов талона
      description: >-
        Без цели вызывает CallNext с порядком due_at ASC, source_rank ASC, checkin_at ASC,
        id ASC, фильтром ready_at и блокировками FOR UPDATE SKIP LOCKED.
        Непустая цель переключает на CallSpecificTicket без ranking и проверки ready_at.
        Приоритет цели после TrimSpace — ticketId в JSON, publicNumber в JSON,
        затем query ticketId, publicNumber, ticket. Оба режима проверяют OPEN,
        отсутствие активного талона и совместимость услуги.
      parameters:
        - name: windowId
          in: path
          required: true
          schema:
            type: string
        - { name: ticketId, in: query, schema: { type: string } }
        - { name: publicNumber, in: query, schema: { type: string } }
        - { name: ticket, in: query, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ticketId: { type: string }
                publicNumber: { type: string }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '409':
          description: Window Busy or No Eligible Tickets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /operator/tickets/{ticketId}/start:
    post:
      security: [{ sessionCookie: [] }]
      summary: Start service for a ticket
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: string
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '409':
          description: Invalid State
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /operator/tickets/{ticketId}/complete:
    post:
      security: [{ sessionCookie: [] }]
      summary: Complete service for a ticket
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: string
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '409':
          description: Invalid State
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /branches/{branchId}/tickets/live:
    post:
      summary: Create a LIVE ticket (retained legacy alias)
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
        - name: branchId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLiveTicketRequest'
      responses:
        '200':
          description: Exact idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /branches/{branchId}/tickets/appointment:
    post:
      summary: Create an appointment ticket
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
        - name: branchId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppointmentRequest'
      responses:
        '200':
          description: Exact idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentResponse'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentResponse'
        '400':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidState'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/branches/{branchId}/overview:
    get:
      security: [{ sessionCookie: [] }]
      summary: Get admin branch overview
      parameters:
        - name: branchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Admin overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBranchOverview'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/branches/{branchId}/anomalies:
    get:
      security: [{ sessionCookie: [] }]
      summary: List branch anomalies with bounded pagination
      parameters:
        - { name: branchId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Anomaly page
          content:
            application/json:
              schema:
                type: object
                required: [items, total, limit, offset]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AnomalyTicket' } }
                  total: { type: integer, minimum: 0 }
                  limit: { type: integer }
                  offset: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /admin/branches/{branchId}/priorities:
    put:
      security: [{ sessionCookie: [] }]
