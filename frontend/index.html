<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Электронная очередь отделения Почты России — получите талон онлайн или на терминале" />
    <title>Почта России • Электронная очередь</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Golos Text, Manrope, JetBrains Mono — шрифты дизайн-системы Почты России -->
    <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800;900&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <style>
      :root {
        /* Дизайн-токены: Postal Reflex Blue & Deep Cobalt */
        --color-primary:    #052F85;   /* Postal Reflex Blue */
        --color-cobalt:     #031E56;   /* Deep Cobalt */
        --color-accent:     #0EA5E9;   /* sky-500, бирюзовый */
        --color-accent-2:   #0055A5;   /* Ultramarine Blue */
        --color-bg:         #F8FAFC;   /* Canvas */
        --color-surface:    #FFFFFF;
        --color-border:     #E2E8F0;   /* Borders */
        --color-text:       #0F172A;
        --color-text-muted: #64748B;
        /* Шрифт: Manrope / Golos Text (основной), JetBrains Mono (моно) */
        --font-primary: 'Manrope', 'Golos Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        --font-mono: 'JetBrains Mono', monospace;
      }
      body { font-family: var(--font-primary); }
    </style>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
