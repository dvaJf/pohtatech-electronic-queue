server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite assets are content-addressed. Never serve the SPA shell for a
    # missing asset: during a rolling deployment an old pod may not contain a
    # newly generated hash, and caching index.html as JavaScript breaks every
    # subsequent client until the CDN entry expires.
    location ^~ /assets/ {
        try_files $uri =404;
        # Without `always`, nginx only attaches the immutable policy to a
        # successful asset response. A rollout-time 404 must remain retryable.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The shell contains the current asset hashes and must be revalidated.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location /healthz {
        access_log off;
        return 200 "healthy\n";
    }
}
