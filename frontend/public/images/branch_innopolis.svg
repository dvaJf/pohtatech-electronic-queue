<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="inno-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="inno-glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <!-- Background building architecture -->
  <rect width="600" height="400" fill="url(#inno-sky)"/>
  <rect x="40" y="80" width="520" height="320" rx="16" fill="#0B132B" opacity="0.7"/>
  <!-- Modern hi-tech facade lines -->
  <line x1="40" y1="160" x2="560" y2="160" stroke="#38BDF8" stroke-width="2" opacity="0.3"/>
  <line x1="40" y1="240" x2="560" y2="240" stroke="#38BDF8" stroke-width="2" opacity="0.3"/>
  <line x1="40" y1="320" x2="560" y2="320" stroke="#38BDF8" stroke-width="2" opacity="0.3"/>
  <line x1="180" y1="80" x2="180" y2="400" stroke="#38BDF8" stroke-width="2" opacity="0.3"/>
  <line x1="320" y1="80" x2="320" y2="400" stroke="#38BDF8" stroke-width="2" opacity="0.3"/>
  <line x1="460" y1="80" x2="460" y2="400" stroke="#38BDF8" stroke-width="2" opacity="0.3"/>
  <!-- Russian Post Banner -->
  <rect x="70" y="110" width="460" height="80" rx="12" fill="#0055A5"/>
  <circle cx="120" cy="150" r="26" fill="#FFFFFF" fill-opacity="0.2"/>
  <g transform="translate(104, 134)" fill="#FFFFFF">
    <path d="M4 8C4 5.79 5.79 4 8 4h16c2.21 0 4 1.79 4 4v16c0 2.21-1.79 4-4 4H8c-2.21 0-4-1.79-4-4V8zm3 2.5l9 6.5 9-6.5v11H7v-11zm2-1.5h14l-7 5.1-7-5.1z"/>
  </g>
  <text x="165" y="145" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="24" letter-spacing="1">ПОЧТА РОССИИ</text>
  <text x="165" y="172" fill="#93C5FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="14">ОПС 420500 • г. Иннополис, Университетская 7</text>
  <!-- Modern glass entrance -->
  <rect x="220" y="240" width="160" height="160" rx="8" fill="url(#inno-glass)"/>
  <line x1="300" y1="240" x2="300" y2="400" stroke="#E0F2FE" stroke-width="3"/>
  <!-- Tech badges -->
  <rect x="70" y="220" width="120" height="34" rx="17" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1.5"/>
  <text x="130" y="242" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" text-anchor="middle">ИННОПОЛИС</text>
</svg>
