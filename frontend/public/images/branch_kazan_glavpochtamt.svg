<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="kazan-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="60%" stop-color="#0F3668"/>
      <stop offset="100%" stop-color="#0055A5"/>
    </linearGradient>
    <linearGradient id="gold-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <!-- Background historic architecture -->
  <rect width="600" height="400" fill="url(#kazan-sky)"/>
  <!-- Historic facade -->
  <rect x="50" y="90" width="500" height="310" rx="12" fill="#1E293B" opacity="0.8"/>
  <!-- Classic columns -->
  <rect x="90" y="160" width="24" height="240" fill="#E2E8F0" opacity="0.85"/>
  <rect x="180" y="160" width="24" height="240" fill="#E2E8F0" opacity="0.85"/>
  <rect x="396" y="160" width="24" height="240" fill="#E2E8F0" opacity="0.85"/>
  <rect x="486" y="160" width="24" height="240" fill="#E2E8F0" opacity="0.85"/>
  <!-- Classical pediment / arch -->
  <polygon points="50,90 300,30 550,90" fill="#0F172A" opacity="0.9"/>
  <!-- Clock on historic building -->
  <circle cx="300" cy="72" r="18" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <line x1="300" y1="72" x2="300" y2="60" stroke="#1E293B" stroke-width="2"/>
  <line x1="300" y1="72" x2="310" y2="72" stroke="#1E293B" stroke-width="2"/>
  <!-- Russian Post Banner -->
  <rect x="140" y="115" width="320" height="60" rx="10" fill="#0055A5"/>
  <circle cx="175" cy="145" r="18" fill="#FFFFFF" fill-opacity="0.2"/>
  <g transform="translate(163, 133)" fill="#FFFFFF">
    <path d="M4 8C4 5.79 5.79 4 8 4h16c2.21 0 4 1.79 4 4v16c0 2.21-1.79 4-4 4H8c-2.21 0-4-1.79-4-4V8zm3 2.5l9 6.5 9-6.5v11H7v-11zm2-1.5h14l-7 5.1-7-5.1z"/>
  </g>
  <text x="210" y="142" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="18" letter-spacing="0.5">ПОЧТА РОССИИ</text>
  <text x="210" y="160" fill="#93C5FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11">ГЛАВПОЧТАМТ КАЗАНЬ 420000</text>
  <!-- Grand entrance -->
  <rect x="235" y="220" width="130" height="180" rx="60 60 0 0" fill="#0F172A"/>
  <rect x="245" y="240" width="110" height="160" rx="50 50 0 0" fill="#38BDF8" fill-opacity="0.3"/>
  <!-- Street address badge -->
  <rect x="180" y="340" width="240" height="30" rx="15" fill="#0284C7" fill-opacity="0.3" stroke="#38BDF8" stroke-width="1"/>
  <text x="300" y="360" fill="#E0F2FE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" text-anchor="middle">ул. Кремлёвская, д. 8</text>
</svg>
