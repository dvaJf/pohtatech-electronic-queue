apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  APP_ENV: {{ .Values.backend.config.appEnv | quote }}
  LOG_LEVEL: {{ .Values.backend.config.logLevel | quote }}
  HTTP_PORT: {{ .Values.backend.service.port | quote }}
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  CORS_ALLOWED_ORIGIN: {{ .Values.backend.config.corsAllowedOrigin | quote }}
  NOTIFICATION_PROVIDER_URL: {{ .Values.backend.config.notificationProviderUrl | quote }}
  NOTIFICATION_TIMEOUT_SECONDS: {{ .Values.backend.config.notificationTimeoutSeconds | quote }}
  NOTIFICATION_RETRY_INTERVAL_MS: {{ .Values.backend.config.notificationRetryIntervalMs | quote }}
  NOTIFICATION_MAX_ATTEMPTS: {{ .Values.backend.config.notificationMaxAttempts | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318"
