    \n        SET number = number + 100000 \n        WHERE branch_id = b.branch_id;\n\n
    \       WITH ordered AS (\n            SELECT id, ROW_NUMBER() OVER (ORDER BY
    number ASC) AS new_num\n            FROM windows\n            WHERE branch_id
    = b.branch_id\n        )\n        UPDATE windows w\n        SET number = o.new_num\n
    \       FROM ordered o\n        WHERE w.id = o.id;\n    END LOOP;\nEND $$;\n\n\n--
