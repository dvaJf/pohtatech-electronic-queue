    -- === 000011_return_redirect_events.up.sql ===
    -- Extend audit coverage only; existing immutable events and lifecycle remain unchanged.
    ALTER TABLE ticket_events DROP CONSTRAINT ticket_events_type_check, DROP CONSTRAINT ticket_events_check;
    ALTER TABLE ticket_events
     ADD CONSTRAINT ticket_events_type_check CHECK (type IN ('CREATED','ARRIVED','CALLED','SERVICE_STARTED','COMPLETED','CANCELLED','NO_SHOW','RETURNED','REDIRECTED')),
     ADD CONSTRAINT ticket_events_check CHECK (
     (type='CREATED' AND from_status IS NULL AND to_status IN ('WAITING','SCHEDULED') AND window_id IS NULL)
     OR (type='ARRIVED' AND from_status IS NOT NULL AND from_status='SCHEDULED' AND to_status='SCHEDULED' AND window_id IS NULL)
     OR (type='CALLED' AND from_status IS NOT NULL AND from_status IN ('WAITING','SCHEDULED') AND to_status='CALLED' AND window_id IS NOT NULL)
     OR (type='SERVICE_STARTED' AND from_status IS NOT NULL AND from_status='CALLED' AND to_status='SERVING' AND window_id IS NOT NULL)
     OR (type='COMPLETED' AND from_status IS NOT NULL AND from_status='SERVING' AND to_status='COMPLETED' AND window_id IS NOT NULL)
     OR (type='CANCELLED' AND from_status IS NOT NULL AND from_status='SCHEDULED' AND to_status='CANCELLED' AND window_id IS NULL)
     OR (type='NO_SHOW' AND from_status IS NOT NULL AND from_status='CALLED' AND to_status='NO_SHOW' AND window_id IS NOT NULL)
     OR (type IN ('RETURNED','REDIRECTED') AND from_status IS NOT NULL AND from_status IN ('CALLED','SERVING') AND to_status='WAITING'));



    -- === 000012_window_services_unfreeze.up.sql ===
    -- Operators must always be able to drop a window capability, even when the window
    -- already served tickets of that service. The composite foreign key from tickets to
    -- window_services was the only blocker: it froze historical capabilities in place and
    -- made DELETE FROM window_services fail with SQLSTATE 23503. Ticket integrity stays
    -- protected by the remaining tickets foreign keys — (window_id, branch_id) references
    -- windows(id, branch_id) and (branch_id, service_id) references
    -- branch_services(branch_id, service_id).
    ALTER TABLE tickets DROP CONSTRAINT IF EXISTS tickets_window_id_service_id_fkey;



    -- === 000013_cancel_waiting_tickets.up.sql ===
    ALTER TABLE ticket_events DROP CONSTRAINT ticket_events_check;
    ALTER TABLE ticket_events
      ADD CONSTRAINT ticket_events_check CHECK (
      (type='CREATED' AND from_status IS NULL AND to_status IN ('WAITING','SCHEDULED') AND window_id IS NULL)
      OR (type='ARRIVED' AND from_status IS NOT NULL AND from_status='SCHEDULED' AND to_status='SCHEDULED' AND window_id IS NULL)
      OR (type='CALLED' AND from_status IS NOT NULL AND from_status IN ('WAITING','SCHEDULED') AND to_status='CALLED' AND window_id IS NOT NULL)
      OR (type='SERVICE_STARTED' AND from_status IS NOT NULL AND from_status='CALLED' AND to_status='SERVING' AND window_id IS NOT NULL)
      OR (type='COMPLETED' AND from_status IS NOT NULL AND from_status='SERVING' AND to_status='COMPLETED' AND window_id IS NOT NULL)
      OR (type='CANCELLED' AND from_status IS NOT NULL AND from_status IN ('SCHEDULED','WAITING') AND to_status='CANCELLED' AND window_id IS NULL)
      OR (type='NO_SHOW' AND from_status IS NOT NULL AND from_status='CALLED' AND to_status='NO_SHOW' AND window_id IS NOT NULL)
      OR (type IN ('RETURNED','REDIRECTED') AND from_status IS NOT NULL AND from_status IN ('CALLED','SERVING') AND to_status='WAITING'));


    -- === 000014_due_at_queue_engine.up.sql ===
    -- Add due_at algorithm scheduling columns to tickets
    ALTER TABLE tickets
      ADD COLUMN IF NOT EXISTS checkin_at timestamptz,
      ADD COLUMN IF NOT EXISTS ready_at timestamptz,
      ADD COLUMN IF NOT EXISTS due_at timestamptz,
      ADD COLUMN IF NOT EXISTS source_rank integer NOT NULL DEFAULT 1,
      ADD COLUMN IF NOT EXISTS policy_version bigint NOT NULL DEFAULT 1,
      ADD COLUMN IF NOT EXISTS recall_count integer NOT NULL DEFAULT 0,
      ADD COLUMN IF NOT EXISTS client_id text;

    -- Add journal tracking columns to ticket_events
    ALTER TABLE ticket_events
      ADD COLUMN IF NOT EXISTS actor text,
      ADD COLUMN IF NOT EXISTS reason text,
      ADD COLUMN IF NOT EXISTS due_at timestamptz,
      ADD COLUMN IF NOT EXISTS request_id text,
      ADD COLUMN IF NOT EXISTS at timestamptz DEFAULT clock_timestamp();

    -- Backfill existing WAITING tickets
    UPDATE tickets
    SET checkin_at = COALESCE(arrived_at, queue_entered_at, created_at),
        ready_at = COALESCE(arrived_at, queue_entered_at, created_at),
        due_at = COALESCE(arrived_at, queue_entered_at, created_at) + interval '30 minutes',
        source_rank = CASE source WHEN 'APPOINTMENT' THEN 0 WHEN 'QR' THEN 1 ELSE 2 END,
        policy_version = 1,
        recall_count = 0
    WHERE status = 'WAITING' AND due_at IS NULL;

    -- Backfill existing SCHEDULED tickets (appointment slot time is due_at, ready at slot - 10 min)
    UPDATE tickets
    SET ready_at = COALESCE(scheduled_at - interval '10 minutes', created_at),
        due_at = COALESCE(scheduled_at, created_at),
        source_rank = 0,
        policy_version = 1,
        recall_count = 0
    WHERE status = 'SCHEDULED' AND due_at IS NULL;

    -- Backfill CALLED and SERVING tickets
    UPDATE tickets
    SET checkin_at = COALESCE(arrived_at, queue_entered_at, created_at),
        ready_at = COALESCE(arrived_at, queue_entered_at, created_at),
        due_at = COALESCE(scheduled_at, queue_entered_at, created_at),
        source_rank = CASE source WHEN 'APPOINTMENT' THEN 0 WHEN 'QR' THEN 1 ELSE 2 END,
        policy_version = 1,
        recall_count = 0
    WHERE status IN ('CALLED', 'SERVING') AND due_at IS NULL;

    -- Index for due_at queue ordering
    CREATE INDEX IF NOT EXISTS tickets_waiting_due_at ON tickets(due_at, source_rank, checkin_at, id)
      WHERE status = 'WAITING';

    -- Unique partial index: one active ticket per client
    CREATE UNIQUE INDEX IF NOT EXISTS tickets_one_active_per_client ON tickets(client_id)
      WHERE status IN ('WAITING', 'CALLED', 'SERVING') AND client_id IS NOT NULL;

    -- Index on ticket_events request_id for idempotent call-next lookups
    CREATE INDEX IF NOT EXISTS ticket_events_request_id ON ticket_events(request_id)
      WHERE request_id IS NOT NULL;

    -- Allow ARRIVED events to transition to WAITING as well as SCHEDULED
    ALTER TABLE ticket_events DROP CONSTRAINT IF EXISTS ticket_events_check;
    ALTER TABLE ticket_events ADD CONSTRAINT ticket_events_check CHECK (
      (type='CREATED' AND from_status IS NULL AND to_status IN ('WAITING','SCHEDULED') AND window_id IS NULL)
      OR (type='ARRIVED' AND from_status IS NOT NULL AND from_status='SCHEDULED' AND to_status IN ('SCHEDULED','WAITING') AND window_id IS NULL)
      OR (type='CALLED' AND from_status IS NOT NULL AND from_status IN ('WAITING','SCHEDULED','CALLED') AND to_status='CALLED' AND window_id IS NOT NULL)
      OR (type='SERVICE_STARTED' AND from_status IS NOT NULL AND from_status='CALLED' AND to_status='SERVING' AND window_id IS NOT NULL)
      OR (type='COMPLETED' AND from_status IS NOT NULL AND from_status='SERVING' AND to_status='COMPLETED' AND window_id IS NOT NULL)
      OR (type='CANCELLED' AND from_status IS NOT NULL AND from_status IN ('SCHEDULED','WAITING') AND to_status='CANCELLED' AND window_id IS NULL)
      OR (type='NO_SHOW' AND from_status IS NOT NULL AND from_status='CALLED' AND to_status='NO_SHOW' AND window_id IS NOT NULL)
      OR (type IN ('RETURNED','REDIRECTED') AND from_status IS NOT NULL AND from_status IN ('CALLED','SERVING') AND to_status='WAITING')
    );

    -- Trigger to reject UPDATE/DELETE mutations on ticket_events (append-only audit log)
    CREATE OR REPLACE FUNCTION trg_ticket_events_append_only()
    RETURNS TRIGGER AS $$
    BEGIN
        IF TG_OP = 'UPDATE' THEN
            RAISE EXCEPTION 'ticket_events is append-only: UPDATE is rejected';
        ELSIF TG_OP = 'DELETE' THEN
            RAISE EXCEPTION 'ticket_events is append-only: DELETE is rejected';
        END IF;
        RETURN NULL;
    END;
    $$ LANGUAGE plpgsql;

    DROP TRIGGER IF EXISTS trg_ticket_events_no_mutation ON ticket_events;
    CREATE TRIGGER trg_ticket_events_no_mutation
    BEFORE UPDATE OR DELETE ON ticket_events
    FOR EACH ROW EXECUTE FUNCTION trg_ticket_events_append_only();

    -- Trigger to synchronize due_at and ready_at when scheduled_at or checkin_at are modified
    CREATE OR REPLACE FUNCTION trg_tickets_sync_due_at()
    RETURNS TRIGGER AS $$
    BEGIN
        IF NEW.source = 'APPOINTMENT' THEN
            IF NEW.scheduled_at IS NOT NULL AND (TG_OP = 'INSERT' OR NEW.scheduled_at IS DISTINCT FROM OLD.scheduled_at) THEN
                NEW.due_at := NEW.scheduled_at;
                IF NEW.checkin_at IS NULL THEN
                    NEW.ready_at := NEW.scheduled_at;
                ELSE
                    NEW.ready_at := GREATEST(NEW.checkin_at, NEW.scheduled_at - INTERVAL '10 minutes');
                END IF;
            END IF;
        ELSE
            -- For QR and LIVE
            IF TG_OP = 'UPDATE' AND NEW.queue_entered_at IS DISTINCT FROM OLD.queue_entered_at THEN
                NEW.checkin_at := COALESCE(NEW.queue_entered_at, NEW.checkin_at, clock_timestamp());
                NEW.ready_at := COALESCE(NEW.queue_entered_at, NEW.ready_at, clock_timestamp());
                NEW.due_at := COALESCE(NEW.queue_entered_at, NEW.due_at, clock_timestamp()) + INTERVAL '30 minutes';
            ELSIF NEW.due_at IS NULL THEN
                NEW.due_at := COALESCE(NEW.checkin_at, NEW.queue_entered_at, clock_timestamp()) + INTERVAL '30 minutes';
                NEW.ready_at := COALESCE(NEW.checkin_at, NEW.queue_entered_at, clock_timestamp());
            END IF;
        END IF;
        RETURN NEW;
    END;
    $$ LANGUAGE plpgsql;

    DROP TRIGGER IF EXISTS trg_tickets_sync_due ON tickets;
    CREATE TRIGGER trg_tickets_sync_due
    BEFORE INSERT OR UPDATE OF scheduled_at, queue_entered_at, checkin_at ON tickets
    FOR EACH ROW EXECUTE FUNCTION trg_tickets_sync_due_at();


    -- === 000015_renumber_windows.up.sql ===
    DO $$
    DECLARE
        b RECORD;
    BEGIN
        FOR b IN SELECT DISTINCT branch_id FROM windows LOOP
            UPDATE windows
            SET number = number + 100000
            WHERE branch_id = b.branch_id;

            WITH ordered AS (
                SELECT id, ROW_NUMBER() OVER (ORDER BY number ASC) AS new_num
                FROM windows
                WHERE branch_id = b.branch_id
            )
            UPDATE windows w
            SET number = o.new_num
            FROM ordered o
            WHERE w.id = o.id;
        END LOOP;
    END $$;


    -- === 000016_notification_outbox.up.sql ===
    CREATE TABLE IF NOT EXISTS notification_outbox (
        id              uuid PRIMARY KEY DEFAULT gen_random_uuid(),
        ticket_id       uuid NOT NULL REFERENCES tickets(id) ON DELETE CASCADE,
        branch_id       uuid NOT NULL REFERENCES branches(id) ON DELETE CASCADE,
        event_type      text NOT NULL,
        payload         jsonb NOT NULL DEFAULT '{}'::jsonb,
        status          text NOT NULL DEFAULT 'PENDING'
            CONSTRAINT notification_outbox_status_check CHECK (status IN ('PENDING', 'SENT', 'FAILED')),
        attempts        int NOT NULL DEFAULT 0,
        max_attempts    int NOT NULL DEFAULT 3,
        next_attempt_at timestamptz NOT NULL DEFAULT clock_timestamp(),
        created_at      timestamptz NOT NULL DEFAULT clock_timestamp(),
        sent_at         timestamptz,
        last_error      text
    );

    CREATE INDEX IF NOT EXISTS notification_outbox_pending_idx
        ON notification_outbox(status, next_attempt_at)
        WHERE status = 'PENDING';

    CREATE INDEX IF NOT EXISTS notification_outbox_ticket_idx
        ON notification_outbox(ticket_id);


    -- === 000017_operator_incidents.up.sql ===
    CREATE TABLE IF NOT EXISTS operator_incidents (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        branch_id UUID NOT NULL REFERENCES branches(id) ON DELETE CASCADE,
        window_id UUID REFERENCES windows(id) ON DELETE SET NULL,
        operator_id UUID REFERENCES users(id) ON DELETE SET NULL,
        category TEXT NOT NULL,
        description TEXT NOT NULL,
        created_at TIMESTAMPTZ NOT NULL DEFAULT clock_timestamp()
    );

    CREATE INDEX IF NOT EXISTS idx_operator_incidents_branch ON operator_incidents(branch_id, created_at DESC);


    -- === 000018_near_turn_and_policy_audit.up.sql ===
    ALTER TABLE notification_outbox ADD COLUMN IF NOT EXISTS dedupe_key text;
    CREATE UNIQUE INDEX IF NOT EXISTS notification_outbox_dedupe_idx ON notification_outbox(dedupe_key);

    ALTER TABLE ticket_events DROP CONSTRAINT IF EXISTS ticket_events_type_check;
    ALTER TABLE ticket_events ADD CONSTRAINT ticket_events_type_check CHECK (
      type = ANY (ARRAY['CREATED'::text, 'ARRIVED'::text, 'CALLED'::text, 'SERVICE_STARTED'::text, 'COMPLETED'::text, 'CANCELLED'::text, 'NO_SHOW'::text, 'RETURNED'::text, 'REDIRECTED'::text, 'QUEUE_RECALCULATED'::text])
    );

    ALTER TABLE ticket_events DROP CONSTRAINT IF EXISTS ticket_events_check1;
    ALTER TABLE ticket_events ADD CONSTRAINT ticket_events_check1 CHECK (
      (type = ANY (ARRAY['CALLED'::text, 'QUEUE_RECALCULATED'::text]) AND policy_version IS NOT NULL AND policy_version > 0)
      OR (type <> ALL (ARRAY['CALLED'::text, 'QUEUE_RECALCULATED'::text]) AND policy_version IS NULL AND decision_priority IS NULL)
    );

    ALTER TABLE ticket_events DROP CONSTRAINT IF EXISTS ticket_events_check;
    ALTER TABLE ticket_events ADD CONSTRAINT ticket_events_check CHECK (
      (type = 'CREATED'::text AND from_status IS NULL AND (to_status = ANY (ARRAY['WAITING'::text, 'SCHEDULED'::text])) AND window_id IS NULL)
      OR (type = 'ARRIVED'::text AND from_status IS NOT NULL AND from_status = 'SCHEDULED'::text AND (to_status = ANY (ARRAY['SCHEDULED'::text, 'WAITING'::text])) AND window_id IS NULL)
      OR (type = 'CALLED'::text AND from_status IS NOT NULL AND (from_status = ANY (ARRAY['WAITING'::text, 'SCHEDULED'::text, 'CALLED'::text])) AND to_status = 'CALLED'::text AND window_id IS NOT NULL)
      OR (type = 'SERVICE_STARTED'::text AND from_status IS NOT NULL AND from_status = 'CALLED'::text AND to_status = 'SERVING'::text AND window_id IS NOT NULL)
      OR (type = 'COMPLETED'::text AND from_status IS NOT NULL AND from_status = 'SERVING'::text AND to_status = 'COMPLETED'::text AND window_id IS NOT NULL)
      OR (type = 'CANCELLED'::text AND from_status IS NOT NULL AND (from_status = ANY (ARRAY['SCHEDULED'::text, 'WAITING'::text])) AND to_status = 'CANCELLED'::text AND window_id IS NULL)
      OR (type = 'NO_SHOW'::text AND from_status IS NOT NULL AND from_status = 'CALLED'::text AND to_status = 'NO_SHOW'::text AND window_id IS NOT NULL)
      OR ((type = ANY (ARRAY['RETURNED'::text, 'REDIRECTED'::text])) AND from_status IS NOT NULL AND (from_status = ANY (ARRAY['CALLED'::text, 'SERVING'::text])) AND to_status = 'WAITING'::text)
      OR (type = 'QUEUE_RECALCULATED'::text AND from_status IS NULL AND (to_status = ANY (ARRAY['WAITING'::text, 'SCHEDULED'::text])) AND window_id IS NULL)
    );

    -- === 000019_ticket_management_and_requeue.up.sql ===
    ALTER TABLE tickets
      ADD COLUMN IF NOT EXISTS management_token_hash text,
      ADD COLUMN IF NOT EXISTS requeued_at timestamptz;

    CREATE INDEX IF NOT EXISTS idx_tickets_management_token_hash
      ON tickets(management_token_hash)
      WHERE management_token_hash IS NOT NULL;

    -- === 000020_branch_coordinates.up.sql ===
    ALTER TABLE branches
      ADD COLUMN IF NOT EXISTS latitude double precision,
      ADD COLUMN IF NOT EXISTS longitude double precision,
      ADD COLUMN IF NOT EXISTS is_demo boolean NOT NULL DEFAULT false;

    DO $$
    BEGIN
      IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'branch_coordinate_pair') THEN
        ALTER TABLE branches ADD CONSTRAINT branch_coordinate_pair CHECK ((latitude IS NULL) = (longitude IS NULL));
      END IF;
      IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'branch_latitude_range') THEN
        ALTER TABLE branches ADD CONSTRAINT branch_latitude_range CHECK (latitude BETWEEN -90 AND 90);
      END IF;
      IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'branch_longitude_range') THEN
        ALTER TABLE branches ADD CONSTRAINT branch_longitude_range CHECK (longitude BETWEEN -180 AND 180);
      END IF;
    END $$;

    -- === 000021_user_phone_and_sms.up.sql ===
    ALTER TABLE users
      ADD COLUMN IF NOT EXISTS phone text,
      ADD COLUMN IF NOT EXISTS phone_verified boolean NOT NULL DEFAULT false,
      ADD COLUMN IF NOT EXISTS phone_code text,
      ADD COLUMN IF NOT EXISTS phone_code_expires_at timestamptz;

    CREATE INDEX IF NOT EXISTS users_phone_idx ON users(phone) WHERE phone IS NOT NULL;

    ALTER TABLE tickets
      ADD COLUMN IF NOT EXISTS sms_reminder_sent boolean NOT NULL DEFAULT false;

    CREATE INDEX IF NOT EXISTS tickets_sms_reminder_idx ON tickets(scheduled_at, sms_reminder_sent, status)
      WHERE source = 'APPOINTMENT' AND status = 'SCHEDULED' AND sms_reminder_sent = false;

    -- === 000022_email_confirm_code.up.sql ===
    ALTER TABLE users
      ADD COLUMN IF NOT EXISTS confirm_code VARCHAR(6),
      ADD COLUMN IF NOT EXISTS confirm_code_expires_at TIMESTAMPTZ;

    CREATE INDEX IF NOT EXISTS idx_users_confirm_code ON users(email, confirm_code);

    -- === 000023_multichannel_notifications.up.sql ===
    CREATE TABLE IF NOT EXISTS notification_subscriptions (
        id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
        ticket_id uuid NOT NULL REFERENCES tickets(id) ON DELETE CASCADE,
        channel text NOT NULL CHECK (channel IN ('TELEGRAM','WEB_PUSH','SMS','EMAIL')),
        destination text NOT NULL,
        enabled boolean NOT NULL DEFAULT true,
        created_at timestamptz NOT NULL DEFAULT clock_timestamp(),
        updated_at timestamptz NOT NULL DEFAULT clock_timestamp(),
        UNIQUE (ticket_id, channel, destination)
    );
    CREATE INDEX IF NOT EXISTS notification_subscriptions_ticket_channel_idx ON notification_subscriptions(ticket_id, channel) WHERE enabled;

    CREATE TABLE IF NOT EXISTS telegram_link_tokens (
        id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
        ticket_id uuid NOT NULL REFERENCES tickets(id) ON DELETE CASCADE,
        token_hash text NOT NULL UNIQUE,
        expires_at timestamptz NOT NULL,
        consumed_at timestamptz,
        created_at timestamptz NOT NULL DEFAULT clock_timestamp()
    );
    CREATE INDEX IF NOT EXISTS telegram_link_tokens_active_idx ON telegram_link_tokens(token_hash, expires_at) WHERE consumed_at IS NULL;

    ALTER TABLE notification_outbox ADD COLUMN IF NOT EXISTS channel text NOT NULL DEFAULT 'DEMO';
    ALTER TABLE notification_outbox ADD COLUMN IF NOT EXISTS subscription_id uuid REFERENCES notification_subscriptions(id) ON DELETE SET NULL;
    ALTER TABLE notification_outbox ADD COLUMN IF NOT EXISTS destination text;
    ALTER TABLE notification_outbox ADD COLUMN IF NOT EXISTS available_at timestamptz NOT NULL DEFAULT clock_timestamp();
    ALTER TABLE notification_outbox ADD COLUMN IF NOT EXISTS claimed_until timestamptz;
    CREATE INDEX IF NOT EXISTS notification_outbox_delivery_pending_idx ON notification_outbox(status, available_at, next_attempt_at) WHERE status = 'PENDING';
    CREATE UNIQUE INDEX IF NOT EXISTS notification_outbox_delivery_dedupe_idx ON notification_outbox(dedupe_key) WHERE dedupe_key IS NOT NULL;

    -- === 000024_ticket_feedback.up.sql ===
    CREATE TABLE IF NOT EXISTS ticket_feedback (
        id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
        ticket_id uuid NOT NULL UNIQUE REFERENCES tickets(id) ON DELETE RESTRICT,
        rating smallint NOT NULL CHECK (rating BETWEEN 1 AND 5),
        comment text NOT NULL DEFAULT '' CHECK (char_length(comment) <= 500),
        created_at timestamptz NOT NULL DEFAULT clock_timestamp()
    );
    CREATE INDEX IF NOT EXISTS ticket_feedback_created_at_idx ON ticket_feedback(created_at DESC);

    -- === 000025_alice_external_accounts.up.sql ===
    CREATE TABLE IF NOT EXISTS external_accounts (
        id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id uuid NOT NULL REFERENCES users(id) ON DELETE CASCADE,
        provider varchar(50) NOT NULL,
        external_user_id varchar(255) NOT NULL,
        created_at timestamptz NOT NULL DEFAULT clock_timestamp(),
        updated_at timestamptz NOT NULL DEFAULT clock_timestamp(),
        CONSTRAINT external_accounts_provider_external_id_unique UNIQUE (provider, external_user_id)
    );

    CREATE INDEX IF NOT EXISTS external_accounts_user_id_idx ON external_accounts(user_id);

    -- === 000026_alice_user_sync.up.sql ===
    DO $$
    DECLARE
        oauth_uid uuid;
    BEGIN
        SELECT id INTO oauth_uid FROM users
        WHERE (email LIKE '%@yandex.ru' OR password_hash = 'OAUTH_ACCOUNT')
          AND email NOT LIKE '%@alice.yandex.ru'
        ORDER BY created_at DESC LIMIT 1;

        IF oauth_uid IS NOT NULL THEN
            UPDATE external_accounts SET user_id = oauth_uid WHERE provider = 'yandex_alice';
            UPDATE tickets SET client_id = oauth_uid::text
            WHERE client_id IN (SELECT id::text FROM users WHERE email LIKE 'yandex_alice_%');
        END IF;
    END $$;

    -- === schema_migrations (golang-migrate compatibility) ===
    CREATE TABLE IF NOT EXISTS schema_migrations (
      version bigint NOT NULL PRIMARY KEY,
      dirty boolean NOT NULL
    );
    DELETE FROM schema_migrations;
    INSERT INTO schema_migrations (version, dirty) VALUES (26, false);

