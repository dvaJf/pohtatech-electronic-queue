    request_id for idempotent call-next lookups\nCREATE INDEX IF NOT EXISTS ticket_events_request_id
    ON ticket_events(request_id)\n  WHERE request_id IS NOT NULL;\n\n-- Allow ARRIVED
    events to transition to WAITING as well as SCHEDULED\nALTER TABLE ticket_events
    DROP CONSTRAINT IF EXISTS ticket_events_check;\nALTER TABLE ticket_events ADD
    CONSTRAINT ticket_events_check CHECK (\n  (type='CREATED' AND from_status IS NULL
    AND to_status IN ('WAITING','SCHEDULED') AND window_id IS NULL)\n  OR (type='ARRIVED'
    AND from_status IS NOT NULL AND from_status='SCHEDULED' AND to_status IN ('SCHEDULED','WAITING')
    AND window_id IS NULL)\n  OR (type='CALLED' AND from_status IS NOT NULL AND from_status
    IN ('WAITING','SCHEDULED','CALLED') AND to_status='CALLED' AND window_id IS NOT
    NULL)\n  OR (type='SERVICE_STARTED' AND from_status IS NOT NULL AND from_status='CALLED'
    AND to_status='SERVING' AND window_id IS NOT NULL)\n  OR (type='COMPLETED' AND
    from_status IS NOT NULL AND from_status='SERVING' AND to_status='COMPLETED' AND
    window_id IS NOT NULL)\n  OR (type='CANCELLED' AND from_status IS NOT NULL AND
    from_status IN ('SCHEDULED','WAITING') AND to_status='CANCELLED' AND window_id
    IS NULL)\n  OR (type='NO_SHOW' AND from_status IS NOT NULL AND from_status='CALLED'
    AND to_status='NO_SHOW' AND window_id IS NOT NULL)\n  OR (type IN ('RETURNED','REDIRECTED')
    AND from_status IS NOT NULL AND from_status IN ('CALLED','SERVING') AND to_status='WAITING')\n);\n\n--
    Trigger to reject UPDATE/DELETE mutations on ticket_events (append-only audit
    log)\nCREATE OR REPLACE FUNCTION trg_ticket_events_append_only()\nRETURNS TRIGGER
    AS $$\nBEGIN\n    IF TG_OP = 'UPDATE' THEN\n        RAISE EXCEPTION 'ticket_events
    is append-only: UPDATE is rejected';\n    ELSIF TG_OP = 'DELETE' THEN\n        RAISE
    EXCEPTION 'ticket_events is append-only: DELETE is rejected';\n    END IF;\n    RETURN
    NULL;\nEND;\n$$ LANGUAGE plpgsql;\n\nDROP TRIGGER IF EXISTS trg_ticket_events_no_mutation
