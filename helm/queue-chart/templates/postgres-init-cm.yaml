    AS $$\nBEGIN\n    IF NEW.source = 'APPOINTMENT' THEN\n        IF NEW.scheduled_at
    IS NOT NULL AND (TG_OP = 'INSERT' OR NEW.scheduled_at IS DISTINCT FROM OLD.scheduled_at)
    THEN\n            NEW.due_at := NEW.scheduled_at;\n            IF NEW.checkin_at
    IS NULL THEN\n                NEW.ready_at := NEW.scheduled_at;\n            ELSE\n
