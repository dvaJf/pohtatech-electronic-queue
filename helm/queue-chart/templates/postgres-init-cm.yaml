    FROM OLD.queue_entered_at THEN\n            NEW.checkin_at := COALESCE(NEW.queue_entered_at,
    NEW.checkin_at, clock_timestamp());\n            NEW.ready_at := COALESCE(NEW.queue_entered_at,
    NEW.ready_at, clock_timestamp());\n            NEW.due_at := COALESCE(NEW.queue_entered_at,
    NEW.due_at, clock_timestamp()) + INTERVAL '30 minutes';\n        ELSIF NEW.due_at
    IS NULL THEN\n            NEW.due_at := COALESCE(NEW.checkin_at, NEW.queue_entered_at,
    clock_timestamp()) + INTERVAL '30 minutes';\n            NEW.ready_at := COALESCE(NEW.checkin_at,
    NEW.queue_entered_at, clock_timestamp());\n        END IF;\n    END IF;\n    RETURN
    NEW;\nEND;\n$$ LANGUAGE plpgsql;\n\nDROP TRIGGER IF EXISTS trg_tickets_sync_due
