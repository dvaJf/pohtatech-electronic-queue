    \   created_at TIMESTAMPTZ NOT NULL DEFAULT clock_timestamp()\n);\n\nCREATE INDEX
    IF NOT EXISTS idx_operator_incidents_branch ON operator_incidents(branch_id, created_at
    DESC);\n\n\n-- === 000018_near_turn_and_policy_audit.up.sql ===\nALTER TABLE notification_outbox
    ADD COLUMN IF NOT EXISTS dedupe_key text;\nCREATE UNIQUE INDEX IF NOT EXISTS notification_outbox_dedupe_idx
    ON notification_outbox(dedupe_key);\n\nALTER TABLE ticket_events DROP CONSTRAINT
