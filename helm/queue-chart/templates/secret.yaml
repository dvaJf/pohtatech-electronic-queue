apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.postgres.credentials.dbName | quote }}
  POSTGRES_USER: {{ .Values.postgres.credentials.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.credentials.password | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
type: Opaque
stringData:
  YANDEX_CLIENT_ID: {{ .Values.secrets.yandexClientId | quote }}
  YANDEX_CLIENT_SECRET: {{ .Values.secrets.yandexClientSecret | quote }}
  OAUTH_REDIRECT_BASE_URL: {{ .Values.secrets.oauthRedirectBaseUrl | quote }}
  TELEGRAM_BOT_TOKEN: {{ .Values.secrets.telegramBotToken | quote }}
  TELEGRAM_BOT_USERNAME: {{ .Values.secrets.telegramBotUsername | quote }}
  TELEGRAM_WEBHOOK_SECRET: {{ .Values.secrets.telegramWebhookSecret | quote }}
  WEB_PUSH_VAPID_PUBLIC_KEY: {{ .Values.secrets.webPushVapidPublicKey | quote }}
  WEB_PUSH_VAPID_PRIVATE_KEY: {{ .Values.secrets.webPushVapidPrivateKey | quote }}
  WEB_PUSH_CONTACT: {{ .Values.secrets.webPushContact | quote }}
  SMSAERO_EMAIL: {{ .Values.secrets.smsaeroEmail | quote }}
  SMSAERO_API_KEY: {{ .Values.secrets.smsaeroApiKey | quote }}
  SMSAERO_SIGN: {{ .Values.secrets.smsaeroSign | quote }}
  SMSRU_API_KEY: {{ .Values.secrets.smsruApiKey | quote }}
  SMTP_HOST: {{ .Values.secrets.smtpHost | quote }}
  SMTP_PORT: {{ .Values.secrets.smtpPort | quote }}
  SMTP_USER: {{ .Values.secrets.smtpUser | quote }}
  SMTP_PASSWORD: {{ .Values.secrets.smtpPassword | quote }}
  SMTP_FROM: {{ .Values.secrets.smtpFrom | quote }}
  SMTP_APP_BASE_URL: {{ .Values.secrets.smtpAppBaseUrl | quote }}
  RAG_AGENT_URL: {{ .Values.secrets.ragAgentUrl | quote }}
