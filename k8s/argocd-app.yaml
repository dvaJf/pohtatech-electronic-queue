apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: queue-system
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/dvaJf/po-htatech-electronic-queue.git'
    targetRevision: main
    path: helm/queue-chart
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: queue-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
