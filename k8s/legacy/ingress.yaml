apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: queue-ingress
  namespace: queue-system
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web, websecure
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /ready
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
          - path: /jaeger
            pathType: Prefix
            backend:
              service:
                name: jaeger
                port:
                  number: 16686
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
