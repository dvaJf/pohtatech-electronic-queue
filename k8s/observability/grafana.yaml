apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: queue-system
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        uid: PBFA97CFB590B2093
        isDefault: true
      - name: Loki
        type: loki
        access: proxy
        url: http://loki:3100
        uid: Loki
      - name: Jaeger
        type: jaeger
        access: proxy
        url: http://jaeger:16686
        uid: Jaeger
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: queue-system
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'Postcode SUO'
        orgId: 1
        folder: 'Цифровая Очередь'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /etc/grafana/provisioning/dashboards/definitions
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: queue-system
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      containers:
        - name: grafana
          image: grafana/grafana:11.3.0
          imagePullPolicy: IfNotPresent
          env:
            - name: GF_SERVER_ROOT_URL
              value: "https://pointers-team.tech/grafana/"
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: "/etc/grafana/provisioning/dashboards/definitions/overview.json"
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 350m
              memory: 384Mi
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboard-definitions
              mountPath: /etc/grafana/provisioning/dashboards/definitions
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards-provider
          configMap:
            name: grafana-dashboards-provider
        - name: dashboard-definitions
          configMap:
            name: grafana-dashboard-overview
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: queue-system
  labels:
    app: grafana
spec:
  type: ClusterIP
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      name: http
