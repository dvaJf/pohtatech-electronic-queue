apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: queue-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - services
      - endpoints
      - pods
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: queue-system
roleRef:
  kind: ClusterRole
  name: promtail
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: queue-system
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0
      log_level: info

    positions:
      filename: /run/promtail/positions.yaml

    clients:
      - url: http://loki:3100/loki/api/v1/push
        tenant_id: ""

    scrape_configs:
      - job_name: queue-system-pods
        static_configs:
          - targets:
              - localhost
            labels:
              job: queue-system
              __path__: /var/log/pods/queue-system_*/*/*.log
        pipeline_stages:
          - cri: {}
          # Parse slog JSON structure
          - json:
              expressions:
                level: level
                msg: msg
                event: event
                path: path
                status: status
                component: component
                trace_id: trace_id
                span_id: span_id
          # 1. Drop routine health probes (/health, /ready, /metrics)
          - drop:
              expression: '.*("HTTP health probe"|"/health"|"/ready"|"/metrics").*'
          # 2. Drop routine read GET requests
          - drop:
              expression: '.*"HTTP request".*'
          # 3. Label key fields for fast Loki querying
          - labels:
              level:
              event:
              component:
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: queue-system
  labels:
    app: promtail
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: promtail
          image: grafana/promtail:3.0.0
          imagePullPolicy: IfNotPresent
          args:
            - "-config.file=/etc/promtail/promtail.yaml"
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: run
              mountPath: /run/promtail
            - name: pods
              mountPath: /var/log/pods
              readOnly: true
            - name: containers
              mountPath: /var/lib/docker/containers
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: run
          emptyDir: {}
        - name: pods
          hostPath:
            path: /var/log/pods
        - name: containers
          hostPath:
            path: /var/lib/docker/containers
