policy_version: 1

appointment:
  grace_minutes: 30
  early_window_minutes: 15

sources:
  appointment:
    rank: 0
  qr:
    rank: 1
    max_wait_minutes: 30
  live:
    rank: 2
    max_wait_minutes: 30

services:
  "22222222-2222-2222-2222-222222222222":
    max_wait_minutes: 30
  "55555555-5555-5555-5555-555555555555":
    max_wait_minutes: 20

call:
  client_timeout_seconds: 90
  max_recalls: 2

window_close:
  policy: "finish_current" # finish_current | return_to_queue

alerts:
  overdue_after_minutes: 5

ml:
  eta:
    enabled: false
    url: http://ml-service:8090
    timeout_ms: 300
    circuit_breaker_threshold: 3
    circuit_breaker_cooldown_seconds: 10
    cache_ttl_seconds: 5
  noshow:
    enabled: false
    max_abs_adjustment: 15
