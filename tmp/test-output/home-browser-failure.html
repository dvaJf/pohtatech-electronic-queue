:root {
  /* === ЦВЕТОВАЯ ПАЛИТРА ПОЧТЫ РОССИИ === */

  --pochta-text-secondary: #3E5060;      /* Вторичный текст */

  /* Границы и разделители */
  --pochta-border-light: #E3E8EF;        /* Светлая граница */
  --pochta-border-medium: #D0D7E2;       /* Средняя граница */
  --pochta-border-dark: #B8C2D0;         /* Темная граница */
  
  /* Состояния */
  --pochta-success: #2E7D32;             /* Успех/готово */
  --pochta-success-bg: #E8F5E9;          /* Фон успеха */
  --pochta-warning: #ED6C02;             /* Предупреждение */
  --pochta-warning-bg: #FFF4E5;          /* Фон предупреждения */
  --pochta-error: #D32F2F;               /* Ошибка */
  --pochta-error-bg: #FFEBEE;            /* Фон ошибки */
  --pochta-info: #0288D1;                /* Информация */
  --pochta-info-bg: #E3F2FD;             /* Фон информации */
  
  /* === ТИПОГРАФИКА === */
  
  /* Шрифты */
  --font-family-base: 'Onest', 'Manrope', 'Golos Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 
                      'Helvetica Neue', Arial, sans-serif, 
                      'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol';
  --font-family-mono: 'SF Mono', Monaco, 'Cascadia Code', 'Courier New', monospace;

  --font-size-xs: 0.75rem;      /* 12px */
  --font-size-sm: 0.875rem;     /* 14px */

  --font-size-lg: 1.125rem;     /* 18px */
  --font-size-xl: 1.25rem;      /* 20px */
  --font-size-2xl: 1.5rem;      /* 24px */
  --font-size-3xl: 1.875rem;    /* 30px */
  --font-size-4xl: 2.25rem;     /* 36px */
  
  /* Веса шрифтов */
  --font-weight-regular: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;
  
  /* === ИНТЕРВАЛЫ === */
  
  --spacing-xs: 0.25rem;   /* 4px */
  --spacing-sm: 0.5rem;    /* 8px */
  --spacing-md: 1rem;      /* 16px */
  --spacing-lg: 1.5rem;    /* 24px */
  --spacing-xl: 2rem;      /* 32px */
  --spacing-2xl: 3rem;     /* 48px */
  --spacing-3xl: 4rem;     /* 64px */
  
  /* === РАДИУСЫ СКРУГЛЕНИЯ === */
  /* Минималистичный подход - меньше скруглений */
  
  --radius-none: 0;
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;

  font-size: calc(1.5rem * var(--client-text-scale, 1));
  font-weight: 700;
  color: var(--client-primary);
}

.cx-ticket-actions {
  padding: 0 1rem 1rem;
  display: flex;
  flex-direction: column;
  gap: 0.625rem;
}

/* === ВСПОМОГАТЕЛЬНЫЕ ЭЛЕМЕНТЫ === */

.cx-badge {
  display: inline-flex;
  padding: 0.375rem 0.75rem;
  border-radius: 9999px;
  font-size: calc(0.75rem * var(--client-text-scale, 1));
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.025em;
  background: rgba(255, 255, 255, 0.25);
}

.cx-error-box {
  background: #FFEBEE;
  color: #C62828;
  padding: 1rem;
  border-radius: var(--client-radius);
  margin-bottom: 1.5rem;
  font-size: calc(0.875rem * var(--client-text-scale, 1));
  font-weight: 500;
  border-left: 4px solid #D32F2F;
}

.cx-ticket-alert {
  padding: 1rem;
  border-radius: var(--client-radius);
  text-align: center;
  font-weight: 500;
  font-size: calc(0.875rem * var(--client-text-scale, 1));
}

.cx-ticket-alert-success {
  background: var(--client-success-bg);
  color: #1B5E20;
  border: 1px solid var(--client-success);
}

.cx-empty-state {
  text-align: center;
  padding: 3rem 1.5rem;
  background: var(--client-surface);
  border-radius: var(--client-radius-lg);
  border: 2px dashed var(--client-border-medium);
}

.cx-empty-icon {
  color: var(--client-border-medium);
  margin-bottom: 1rem;
  font-size: calc(2rem * var(--client-text-scale, 1));
}

.cx-empty-state h3 {
  margin: 0 0 0.5rem;
  font-size: calc(1.125rem * var(--client-text-scale, 1));
  font-weight: 600;
  color: var(--client-text);
}

.cx-empty-state p {
  color: var(--client-text-secondary);
  margin: 0 0 1.5rem;
  font-size: calc(0.875rem * var(--client-text-scale, 1));
}

.cx-loading-overlay {
  position: absolute;
  inset: 0;
  background: rgba(255, 255, 255, 0.9);
  backdrop-filter: blur(2px);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
  font-size: calc(1.125rem * var(--client-text-scale, 1));
  color: var(--client-primary);
  border-radius: var(--client-radius-lg);
  z-index: 10;
}

.cx-tickets-list {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

/* === ВИДЖЕТ ЗАГРУЗКИ === */

.cx-workload-btn-reset {
  margin: 0 !important;
  padding: 0 !important;
  border: none !important;
  background: transparent !important;
  outline: none !important;
  font: inherit !important;
  line-height: normal !important;
  box-shadow: none !important;
}

.cx-workload-day-pill {
  margin: 0 !important;
  padding: 0.375rem 0.125rem !important;
  border: none !important;
  font-weight: 600 !important;
  font-size: calc(0.8125rem * var(--client-text-scale, 1)) !important;
  border-radius: var(--client-radius) !important;
  cursor: pointer !important;
  transition: all 150ms ease !important;
  display: flex !important;
  flex-direction: column !important;
  align-items: center !important;
  justify-content: center !important;
  text-align: center !important;
}

.cx-workload-day-pill-selected {
  background: var(--client-surface) !important;
  color: var(--client-text) !important;
  box-shadow: 0 1px 3px rgba(10, 25, 41, 0.08) !important;
}

.cx-workload-day-pill-unselected {
  background: transparent !important;
  color: var(--client-text-muted) !important;
}

.cx-workload-day-pill-unselected:hover {
  background: rgba(10, 25, 41, 0.04) !important;
  color: var(--client-text) !important;
}

.cx-workload-bar-column {
  margin: 0 !important;
  padding: 0 !important;
  border: none !important;
  background: transparent !important;
  cursor: pointer !important;
  display: flex !important;
  flex-direction: column !important;
  align-items: center !important;
  justify-content: flex-end !important;
  height: 100% !important;
  width: 100% !important;
  min-width: 0 !important;
}

.cx-workload-bar-fill {
  width: 100%;
  border-radius: 4px;
  transition: height 250ms ease, transform 150ms ease;
}

.cx-workload-bar-green {
  background-color: #2E7D32 !important;
}

.cx-workload-bar-blue {
  background-color: #0288D1 !important;
}

.cx-workload-bar-orange {
  background-color: var(--client-orange) !important;
}

.cx-workload-bar-closed {
  background-color: var(--client-border-medium) !important;
  opacity: 0.5 !important;
}

/* === КНОПКИ ЗАГОЛОВКА === */

.cx-header-btn {
  margin: 0 !important;
  padding: 0.375rem 0.625rem !important;
  border: 1px solid var(--client-border) !important;
  background: var(--client-surface) !important;
  border-radius: var(--client-radius) !important;
  color: var(--client-text) !important;
  cursor: pointer !important;
  transition: all 150ms ease !important;
  font-size: calc(0.875rem * var(--client-text-scale, 1)) !important;
  font-weight: 500 !important;
}

.cx-header-btn:hover {
  background: var(--client-bg) !important;
  border-color: var(--client-border-medium) !important;
}

.main-product-header .cx-header-btn > * {
  color: inherit !important;
}
html:not(.a11y-contrast) .main-product-header .cx-header-btn[aria-pressed="true"] {
  background: #dbeafe !important;
  color: #003b73 !important;
  border-color: #93c5fd !important;
}

@media (max-width: 640px) {
  .main-product-header > div:first-child {
    flex-wrap: nowrap;
    justify-content: space-between;
  }
  #a11y-settings {
    max-height: calc(100dvh - 110px);
    overflow-y: auto;
    top: 100%;
  }
}

.cx-auth-btn {
  margin: 0 !important;
  border: 1px solid var(--client-border) !important;
  background: var(--client-surface) !important;
  color: var(--client-primary) !important;
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  gap: 0.375rem !important;
  border-radius: var(--client-radius) !important;
  font-weight: 600 !important;
  padding: 0.5rem 0.875rem !important;
  cursor: pointer !important;
  transition: all 150ms ease !important;
  font-size: calc(0.875rem * var(--client-text-scale, 1)) !important;
}

.cx-auth-btn:hover {
  background: #E3F2FD !important;
  border-color: var(--client-primary) !important;
}

.cx-message-text {
  min-width: 0;
  overflow-wrap: anywhere;
}

.cx-client-flow .cx-choice {
  width: 100%;
  min-width: 0;
}

.cx-selection-summary {
  display: flex;
  align-items: flex-start;
  gap: 0.75rem;
  padding: 1rem;
  background: var(--client-surface);
  border: 1px solid var(--client-border);
  border-radius: var(--client-radius-lg);
  color: var(--client-text-secondary);
  font-size: calc(0.875rem * var(--client-text-scale, 1));
  overflow-wrap: anywhere;
}

.cx-selection-summary > svg {
  flex-shrink: 0;
  color: var(--client-primary);
}

.cx-selection-summary > div {
  min-width: 0;
}

.cx-selection-summary p {
  margin: 0.25rem 0 0;
}

.cx-request-state {
  padding: 2rem 1rem;
  background: var(--client-surface);
  border: 1px solid var(--client-border);
  border-radius: var(--client-radius-lg);
  text-align: center;
  color: var(--client-text-secondary);
}

.cx-client-flow button:focus-visible {
  outline: 3px solid var(--client-accent);
  outline-offset: 3px;
}

.cx-client-flow .cx-back-btn,
.cx-client-flow [role="alert"] button,
.cx-client-flow [role="status"] button {
  min-width: 44px;
  min-height: 44px;
}

/* === АДАПТИВНОСТЬ === */

@media (min-width: 640px) {
  .cx-ticket-header {
    padding: 2rem 1.5rem;
    gap: 0.75rem;
  }

  .cx-ticket-details {
    padding: 1.5rem;
    gap: 1rem;
  }

  .cx-ticket-actions {
    padding: 0 1.5rem 1.5rem;
    gap: 0.75rem;
  }
}

@media (max-width: 480px) {
  .cx-client-flow header {
    flex-wrap: wrap;
    gap: 0.5rem;
  }

  .cx-client-flow .cx-ticket-row {
    align-items: flex-start;
    flex-wrap: wrap;
  }

  .cx-client-flow .cx-ticket-row strong {
    min-width: 0;
  }

  .client-workspace {
    padding: 1rem 0.75rem;
  }

  .cx-header {
    padding: 0.75rem;
  }

  .cx-home-card {
    padding: 1rem 0.875rem;
  }
}
/* The photo header is its own responsive container: compact map cards can shrink
   independently from the browser viewport. */
.branch-card-photo {
  container-type: inline-size;
}

.branch-photo-badges {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: flex-start;
  gap: 0.375rem;
  pointer-events: none;
}

.branch-rating-badge {
  display: inline-flex;
  align-items: center;
  flex: 0 1 auto;
  min-width: 0;
  max-width: 100%;
  gap: 0.25rem;
  white-space: nowrap;
  pointer-events: auto;
}

.branch-queue-badge {
  flex: 0 0 auto;
  white-space: nowrap;
}

@container (max-width: 340px) {
  .branch-rating-source,
  .branch-queue-suffix {
    display: none;
  }
}

/* Isolated Map Marker styling: strictly single-row, compact, immune to text scaling */
.pvz-pin-marker {
  font-family: 'Manrope', sans-serif !important;
  font-size: 11px !important;
  line-height: 1.2 !important;
  white-space: nowrap !important;
}

.pvz-pin-marker * {
  white-space: nowrap !important;
  line-height: 1.2 !important;
}
