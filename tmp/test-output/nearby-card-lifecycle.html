<html><head><style type="text/css" data-vite-dev-id="/app/src/design-system.css">/**
 * Дизайн-система «Цифровая Очередь» — Почта России
 * Чистый, профессиональный светлый дизайн без AI-слопа
 * Фирменные цвета и типографика Почты России
 */

:root {
  /* === ЦВЕТОВАЯ ПАЛИТРА ПОЧТЫ РОССИИ === */
  
  /* Основные фирменные цвета */
  --pochta-blue-primary: #003B73;        /* Основной синий Почты России */
  --pochta-blue-secondary: #0055A5;      /* Вторичный синий */
  --pochta-blue-light: #1976D2;          /* Светлый акцент */
  --pochta-orange: #FF6B00;              /* Фирменный оранжевый */
  
  /* Светлая палитра для фонов */
  --pochta-bg-primary: #FFFFFF;          /* Чистый белый */
  --pochta-bg-secondary: #F5F7FA;        /* Светло-серый фон */
  --pochta-bg-tertiary: #EDF1F7;         /* Альтернативный фон */
  
  /* Текст */
  --pochta-text-primary: #0A1929;        /* Основной текст */
  --pochta-text-secondary: #3E5060;      /* Вторичный текст */
  --pochta-text-tertiary: #6B7A8D;       /* Третичный текст/подсказки */
  
  /* Границы и разделители */
  --pochta-border-light: #E3E8EF;        /* Светлая граница */
  --pochta-border-medium: #D0D7E2;       /* Средняя граница */
  --pochta-border-dark: #B8C2D0;         /* Темная граница */
  
  /* Состояния */
  --pochta-success: #2E7D32;             /* Успех/готово */
  --pochta-success-bg: #E8F5E9;          /* Фон успеха */
  --pochta-warning: #ED6C02;             /* Предупреждение */
  --pochta-warning-bg: #FFF4E5;          /* Фон предупреждения */
  --pochta-error: #D32F2F;               /* Ошибка */
  --pochta-error-bg: #FFEBEE;            /* Фон ошибки */
  --pochta-info: #0288D1;                /* Информация */
  --pochta-info-bg: #E3F2FD;             /* Фон информации */
  
  /* === ТИПОГРАФИКА === */
  
  /* Шрифты */
  --font-family-base: 'Onest', 'Manrope', 'Golos Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 
                      'Helvetica Neue', Arial, sans-serif, 
                      'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol';
  --font-family-mono: 'SF Mono', Monaco, 'Cascadia Code', 'Courier New', monospace;
  
  /* Размеры шрифтов */
  --font-size-xs: 0.75rem;      /* 12px */
  --font-size-sm: 0.875rem;     /* 14px */
  --font-size-base: 1rem;       /* 16px */
  --font-size-lg: 1.125rem;     /* 18px */
  --font-size-xl: 1.25rem;      /* 20px */
  --font-size-2xl: 1.5rem;      /* 24px */
  --font-size-3xl: 1.875rem;    /* 30px */
  --font-size-4xl: 2.25rem;     /* 36px */
  
  /* Веса шрифтов */
  --font-weight-regular: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;
  
  /* === ИНТЕРВАЛЫ === */
  
  --spacing-xs: 0.25rem;   /* 4px */
  --spacing-sm: 0.5rem;    /* 8px */
  --spacing-md: 1rem;      /* 16px */
  --spacing-lg: 1.5rem;    /* 24px */
  --spacing-xl: 2rem;      /* 32px */
  --spacing-2xl: 3rem;     /* 48px */
  --spacing-3xl: 4rem;     /* 64px */
  
  /* === РАДИУСЫ СКРУГЛЕНИЯ === */
  /* Минималистичный подход - меньше скруглений */
  
  --radius-none: 0;
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;
  --radius-full: 9999px;
  
  /* === ТЕНИ === */
  /* Легкие, едва заметные тени */
  
  --shadow-xs: 0 1px 2px rgba(10, 25, 41, 0.04);
  --shadow-sm: 0 1px 3px rgba(10, 25, 41, 0.06);
  --shadow-md: 0 2px 4px rgba(10, 25, 41, 0.08);
  --shadow-lg: 0 4px 8px rgba(10, 25, 41, 0.10);
  
  /* === ПЕРЕХОДЫ === */
  
  --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
  --transition-base: 200ms cubic-bezier(0.4, 0, 0.2, 1);
  --transition-slow: 300ms cubic-bezier(0.4, 0, 0.2, 1);
  
  /* === ШИРИНА КОНТЕЙНЕРОВ === */
  
  --container-sm: 640px;
  --container-md: 768px;
  --container-lg: 1024px;
  --container-xl: 1280px;
}

/* === RESET И БАЗОВЫЕ СТИЛИ === */

*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

body {
  font-family: var(--font-family-base);
  font-size: var(--font-size-base);
  line-height: 1.5;
  color: var(--pochta-text-primary);
  background-color: var(--pochta-bg-secondary);
}

/* === ТИПОГРАФИЧЕСКИЕ ЭЛЕМЕНТЫ === */

h1, h2, h3, h4, h5, h6 {
  font-weight: var(--font-weight-semibold);
  line-height: 1.25;
  color: inherit;
}

h1 {
  font-size: var(--font-size-3xl);
  font-weight: var(--font-weight-bold);
}

h2 {
  font-size: var(--font-size-2xl);
}

h3 {
  font-size: var(--font-size-xl);
}

h4 {
  font-size: var(--font-size-lg);
}

p {
  margin-bottom: var(--spacing-md);
  line-height: 1.6;
}

/* === КНОПКИ === */

.pochta-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--spacing-sm);
  padding: var(--spacing-sm) var(--spacing-lg);
  font-family: var(--font-family-base);
  font-size: var(--font-size-base);
  font-weight: var(--font-weight-semibold);
  line-height: 1.5;
  text-align: center;
  text-decoration: none;
  border: 1px solid transparent;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: all var(--transition-fast);
  -webkit-user-select: none;
     -moz-user-select: none;
          user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.pochta-btn:focus-visible {
  outline: 2px solid var(--pochta-blue-secondary);
  outline-offset: 2px;
}

.pochta-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  pointer-events: none;
}

/* Размеры кнопок */
.pochta-btn-sm {
  padding: var(--spacing-xs) var(--spacing-md);
  font-size: var(--font-size-sm);
}

.pochta-btn-lg {
  padding: var(--spacing-md) var(--spacing-xl);
  font-size: var(--font-size-lg);
}

/* Варианты кнопок */
.pochta-btn-primary {
  background-color: var(--pochta-blue-primary);
  color: #FFFFFF;
}

.pochta-btn-primary:hover:not(:disabled) {
  background-color: #002A52;
}

.pochta-btn-primary:active:not(:disabled) {
  background-color: #001F3D;
}

.pochta-btn-secondary {
  background-color: var(--pochta-bg-primary);
  color: var(--pochta-blue-primary);
  border-color: var(--pochta-border-medium);
}

.pochta-btn-secondary:hover:not(:disabled) {
  background-color: var(--pochta-bg-tertiary);
  border-color: var(--pochta-border-dark);
}

.pochta-btn-orange {
  background-color: var(--pochta-orange);
  color: #FFFFFF;
}

.pochta-btn-orange:hover:not(:disabled) {
  background-color: #E55F00;
}

.pochta-btn-success {
  background-color: var(--pochta-success);
  color: #FFFFFF;
}

.pochta-btn-success:hover:not(:disabled) {
  background-color: #1B5E20;
}

.pochta-btn-ghost {
  background-color: transparent;
  color: var(--pochta-text-secondary);
  border-color: transparent;
}

.pochta-btn-ghost:hover:not(:disabled) {
  background-color: var(--pochta-bg-tertiary);
}

/* === КАРТОЧКИ === */

.pochta-card {
  background-color: var(--pochta-bg-primary);
  border: 1px solid var(--pochta-border-light);
  border-radius: var(--radius-lg);
  padding: var(--spacing-lg);
  box-shadow: var(--shadow-xs);
}

.pochta-card-header {
  padding-bottom: var(--spacing-md);
  margin-bottom: var(--spacing-md);
  border-bottom: 1px solid var(--pochta-border-light);
}

.pochta-card-title {
  font-size: var(--font-size-lg);
  font-weight: var(--font-weight-semibold);
  color: var(--pochta-blue-primary);
  margin: 0;
}

.pochta-card-body {
  color: var(--pochta-text-primary);
}

/* === ИНПУТЫ === */

.pochta-input,
.pochta-select,
.pochta-textarea {
  width: 100%;
  padding: var(--spacing-sm) var(--spacing-md);
  font-family: var(--font-family-base);
  font-size: var(--font-size-base);
  line-height: 1.5;
  color: var(--pochta-text-primary);
  background-color: var(--pochta-bg-primary);
  border: 1px solid var(--pochta-border-medium);
  border-radius: var(--radius-md);
  transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
}

.pochta-input:focus,
.pochta-select:focus,
.pochta-textarea:focus {
  outline: none;
  border-color: var(--pochta-blue-secondary);
  box-shadow: 0 0 0 3px rgba(0, 85, 165, 0.1);
}

.pochta-input:disabled,
.pochta-select:disabled,
.pochta-textarea:disabled {
  background-color: var(--pochta-bg-tertiary);
  color: var(--pochta-text-tertiary);
  cursor: not-allowed;
}

.pochta-label {
  display: block;
  margin-bottom: var(--spacing-xs);
  font-size: var(--font-size-sm);
  font-weight: var(--font-weight-medium);
  color: var(--pochta-text-primary);
}

/* === BADGE/МЕТКИ === */

.pochta-badge {
  display: inline-flex;
  align-items: center;
  padding: var(--spacing-xs) var(--spacing-sm);
  font-size: var(--font-size-xs);
  font-weight: var(--font-weight-semibold);
  line-height: 1;
  border-radius: var(--radius-full);
  text-transform: uppercase;
  letter-spacing: 0.025em;
}

.pochta-badge-success {
  background-color: var(--pochta-success-bg);
  color: var(--pochta-success);
}

.pochta-badge-warning {
  background-color: var(--pochta-warning-bg);
  color: var(--pochta-warning);
}

.pochta-badge-error {
  background-color: var(--pochta-error-bg);
  color: var(--pochta-error);
}

.pochta-badge-info {
  background-color: var(--pochta-info-bg);
  color: var(--pochta-info);
}

.pochta-badge-neutral {
  background-color: var(--pochta-bg-tertiary);
  color: var(--pochta-text-secondary);
}

/* === АЛЕРТЫ === */

.pochta-alert {
  padding: var(--spacing-md);
  border-radius: var(--radius-md);
  border-left: 4px solid;
  font-size: var(--font-size-sm);
  line-height: 1.5;
}

.pochta-alert-success {
  background-color: var(--pochta-success-bg);
  border-color: var(--pochta-success);
  color: #1B5E20;
}

.pochta-alert-warning {
  background-color: var(--pochta-warning-bg);
  border-color: var(--pochta-warning);
  color: #E65100;
}

.pochta-alert-error {
  background-color: var(--pochta-error-bg);
  border-color: var(--pochta-error);
  color: #C62828;
}

.pochta-alert-info {
  background-color: var(--pochta-info-bg);
  border-color: var(--pochta-info);
  color: #01579B;
}

/* === ТАБЛИЦЫ === */

.pochta-table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--font-size-sm);
}

.pochta-table thead {
  background-color: var(--pochta-bg-tertiary);
}

.pochta-table th {
  padding: var(--spacing-sm) var(--spacing-md);
  text-align: left;
  font-weight: var(--font-weight-semibold);
  color: var(--pochta-text-secondary);
  border-bottom: 2px solid var(--pochta-border-medium);
}

.pochta-table td {
  padding: var(--spacing-sm) var(--spacing-md);
  border-bottom: 1px solid var(--pochta-border-light);
  color: var(--pochta-text-primary);
}

.pochta-table tbody tr:hover {
  background-color: var(--pochta-bg-secondary);
}

/* === РАЗДЕЛИТЕЛИ === */

.pochta-divider {
  height: 1px;
  background-color: var(--pochta-border-light);
  border: none;
  margin: var(--spacing-lg) 0;
}

/* === УТИЛИТЫ === */

.text-center {
  text-align: center;
}

.text-right {
  text-align: right;
}

.font-mono {
  font-family: var(--font-family-mono);
}

.font-bold {
  font-weight: var(--font-weight-bold);
}

.text-primary {
  color: var(--pochta-blue-primary);
}

.text-secondary {
  color: var(--pochta-text-secondary);
}

.text-tertiary {
  color: var(--pochta-text-tertiary);
}

.bg-white {
  background-color: var(--pochta-bg-primary);
}

.bg-gray {
  background-color: var(--pochta-bg-secondary);
}

/* === СЕТКА === */

.pochta-container {
  width: 100%;
  max-width: var(--container-xl);
  margin-left: auto;
  margin-right: auto;
  padding-left: var(--spacing-md);
  padding-right: var(--spacing-md);
}

.pochta-grid {
  display: grid;
  gap: var(--spacing-lg);
}

.pochta-grid-2 {
  grid-template-columns: repeat(2, 1fr);
}

.pochta-grid-3 {
  grid-template-columns: repeat(3, 1fr);
}

.pochta-grid-4 {
  grid-template-columns: repeat(4, 1fr);
}

@media (max-width: 768px) {
  .pochta-grid-2,
  .pochta-grid-3,
  .pochta-grid-4 {
    grid-template-columns: 1fr;
  }
}

.pochta-flex {
  display: flex;
  gap: var(--spacing-md);
}

.pochta-flex-center {
  display: flex;
  align-items: center;
  justify-content: center;
}

.pochta-flex-between {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* === СПЕЦИФИЧНЫЕ КОМПОНЕНТЫ ПОЧТЫ === */

.pochta-header {
  background-color: var(--pochta-bg-primary);
  border-bottom: 1px solid var(--pochta-border-light);
  padding: var(--spacing-md) 0;
  box-shadow: var(--shadow-xs);
}

.pochta-logo {
  color: var(--pochta-blue-primary);
  font-size: var(--font-size-xl);
  font-weight: var(--font-weight-bold);
  text-decoration: none;
}

.pochta-ticket-display {
  font-family: var(--font-family-mono);
  font-size: var(--font-size-4xl);
  font-weight: var(--font-weight-bold);
  color: var(--pochta-blue-primary);
  letter-spacing: 0.05em;
  text-align: center;
}

/* === АДАПТИВНОСТЬ === */

@media (max-width: 768px) {
  :root {
    --font-size-3xl: 1.5rem;
    --font-size-4xl: 1.875rem;
  }
  
  .pochta-btn {
    width: 100%;
    justify-content: center;
  }
  
  .pochta-card {
    padding: var(--spacing-md);
  }
}

/* === ПЕЧАТЬ === */

@media print {
  body {
    background-color: white;
  }
  
  .pochta-btn,
  .pochta-header {
    display: none;
  }
  
  .pochta-card {
    border: none;
    box-shadow: none;
  }
}
</style><style type="text/css" data-vite-dev-id="/app/src/product.css">/* === ПЕРЕМЕННЫЕ ДИЗАЙН-СИСТЕМЫ ПОЧТЫ РОССИИ === */
:root {
  /* Canonical semantic layer. Legacy aliases below remain while client, map
     and back-office surfaces migrate component-by-component. */
  --surface-page: #F6F8FB;
  --surface-card: #FFFFFF;
  --surface-muted: #F1F5F9;
  --surface-elevated: #FFFFFF;
  --text-primary: #102238;
  --text-secondary: #536578;
  --text-muted: #6B7A8D;
  --color-primary: #003B73;
  --color-primary-hover: #00519B;
  --color-primary-active: #002C57;
  --color-primary-soft: #EAF2FB;
  --color-success: #187344;
  --color-success-soft: #E9F6EE;
  --color-warning: #9A6500;
  --color-warning-soft: #FFF3D6;
  --color-danger: #B62936;
  --color-danger-soft: #FDECEF;
  --border-subtle: #DBE3EB;
  --border-strong: #B8C7D6;
  --focus-ring: #0B63CE;
  --radius-control: 8px;
  --radius-card: 16px;
  --radius-overlay: 20px;
  --shadow-sm: 0 1px 2px rgb(13 37 61 / 6%);
  --shadow-md: 0 10px 30px rgb(13 37 61 / 12%);
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --space-6: 24px; --space-8: 32px; --space-12: 48px;

  /* Temporary aliases, intentionally removed only after each surface moves. */
  --brand-primary: var(--color-primary);
  --brand-accent: var(--color-primary-hover);
  --brand-orange: #FF6B00;
  --text: var(--text-primary);
  --muted: var(--text-muted);
  --surface: var(--surface-card);
  --background: var(--surface-page);
  --border: var(--border-subtle);
  --border-medium: var(--border-strong);
  --radius: 6px;
  --radius-lg: 8px;
  --space: 1rem;
  --font: 'Onest Variable', 'Onest', system-ui, -apple-system, "Segoe UI", sans-serif;
  --focus-ring-color: #0B63CE;
  --focus-ring-offset: 3px;
  --client-text-scale: 1;
  --client-text-xs: calc(0.75rem * var(--client-text-scale));
  --client-text-sm: calc(0.875rem * var(--client-text-scale));
  --client-text-base: calc(1rem * var(--client-text-scale));
  --client-text-lg: calc(1.125rem * var(--client-text-scale));
  --client-text-xl: calc(1.25rem * var(--client-text-scale));
  --client-text-2xl: calc(1.5rem * var(--client-text-scale));
  --client-text-3xl: calc(1.875rem * var(--client-text-scale));
}

/* Only typography consumes this preference; rem layout and icon units stay fixed. */
html[data-text-scale="125"] { --client-text-scale: 1.25; }
html[data-text-scale="150"] { --client-text-scale: 1.5; }

:is(.main-product-header, .cx-client-flow, .client-typography) {
  font-size: var(--client-text-base);
}
:is(.main-product-header, .cx-client-flow, .client-typography) .text-xs { font-size: var(--client-text-xs) !important; }
:is(.main-product-header, .cx-client-flow, .client-typography) .text-sm { font-size: var(--client-text-sm) !important; }
:is(.main-product-header, .cx-client-flow, .client-typography) .text-base { font-size: var(--client-text-base) !important; }
:is(.main-product-header, .cx-client-flow, .client-typography) .text-lg { font-size: var(--client-text-lg) !important; }
:is(.main-product-header, .cx-client-flow, .client-typography) .text-xl { font-size: var(--client-text-xl) !important; }
:is(.main-product-header, .cx-client-flow, .client-typography) .text-2xl { font-size: var(--client-text-2xl) !important; }
:is(.main-product-header, .cx-client-flow, .client-typography) .text-3xl { font-size: var(--client-text-3xl) !important; }
:is(.main-product-header, .cx-client-flow, .client-typography) [class~="text-[9px]"] { font-size: calc(9px * var(--client-text-scale)) !important; }
:is(.main-product-header, .cx-client-flow, .client-typography) [class~="text-[10px]"] { font-size: calc(10px * var(--client-text-scale)) !important; }
:is(.main-product-header, .cx-client-flow, .client-typography) [class~="text-[11px]"]:not(.pvz-pin-marker) { font-size: calc(11px * var(--client-text-scale)) !important; }
@media (min-width: 640px) {
  :is(.main-product-header, .cx-client-flow, .client-typography) [class~="sm:text-xs"] { font-size: var(--client-text-xs) !important; }
  :is(.main-product-header, .cx-client-flow, .client-typography) [class~="sm:text-sm"] { font-size: var(--client-text-sm) !important; }
  :is(.main-product-header, .cx-client-flow, .client-typography) [class~="sm:text-base"] { font-size: var(--client-text-base) !important; }
  :is(.main-product-header, .cx-client-flow, .client-typography) [class~="sm:text-lg"] { font-size: var(--client-text-lg) !important; }
  :is(.main-product-header, .cx-client-flow, .client-typography) [class~="sm:text-xl"] { font-size: var(--client-text-xl) !important; }

}

.product-shell input:not([type="checkbox"]):not([type="radio"]):not([style*="padding-left"]):not([class*="pl-"]):not([class*="field-with-icon"]),
.product-shell select {

}

.product-shell input[type="date"] {

  -moz-appearance: none;
       appearance: none;

.product-shell input[style*="padding-left"] {

/* Icon fields keep the icon in its own slot; text can never flow beneath it. */
.field-with-icon { position: relative; }
.field-with-icon__icon {
